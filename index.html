997e16","url":"media/bf67ec10e63ecb2d16ce1fcf67997e16.jpg","caption":"Executive Producer Alisa"},{"id":"02b8c33707b5988730985c4770c678f6","url":"media/02b8c33707b5988730985c4770c678f6.jpg","caption":""},{"id":"27c1c04f10bbd8c93c7842cae012f8af","url":"media/27c1c04f10bbd8c93c7842cae012f8af.jpg","caption":"Everyone"}],"title":"Photo Time","caption":"","file":{"id":"88fcd7dd9ea7214d0ad1e1862c19774d","url":"media/88fcd7dd9ea7214d0ad1e1862c19774d.webm","name":"Photographs.m4a"}},{"id":"j3f542yd","type":"audio","items":[],"files":[],"images":[{"id":"dfe68831e0f2202e0a7573bcde151954","url":"media/dfe68831e0f2202e0a7573bcde151954.jpg","caption":""},{"id":"f97148782093dc37d472cd28df6c49b8","url":"media/f97148782093dc37d472cd28df6c49b8.jpg","caption":""},{"id":"dddd5e5787bf10832e5d37b336e39e97","url":"media/dddd5e5787bf10832e5d37b336e39e97.jpg","caption":""},{"id":"36ad147d2a0836c19b0ce1fad5ea195c","url":"media/36ad147d2a0836c19b0ce1fad5ea195c.jpg","caption":""},{"id":"fa2ad486d92c98c089875d1e79e5598a","url":"media/fa2ad486d92c98c089875d1e79e5598a.jpg","caption":""},{"id":"0176d2c50f6af11c082ed0778840902c","url":"media/0176d2c50f6af11c082ed0778840902c.jpg","caption":""}],"title":"The Crowd Leaves","caption":"","file":{"id":"7438736c10b022045845703a40ad875d","url":"media/7438736c10b022045845703a40ad875d.webm","name":"Goodbye.m4a"}},{"id":"1u8n4rpi","type":"audio","items":[],"files":[],"images":[{"id":"5f1f7b8982be84d275f68efc29e549bb","url":"media/5f1f7b8982be84d275f68efc29e549bb.jpg","caption":""},{"id":"d9cbe50f4931fe2f7125e3912f27d0f6","url":"media/d9cbe50f4931fe2f7125e3912f27d0f6.jpg","caption":""}],"title":"Matt and Willa","caption":"","file":{"id":"6eb8d82a7e9c12c8de4c5f9eab72532e","url":"media/6eb8d82a7e9c12c8de4c5f9eab72532e.webm","name":"Matt and Willa.m4a"}},{"id":"imx08u8s","type":"audio","items":[],"files":[],"images":[{"id":"4b5ba7312ba8c3eb44b88339988a0da3","url":"media/4b5ba7312ba8c3eb44b88339988a0da3.jpg","caption":""},{"id":"42e1114c70896cadb99e9bb9f76c60f3","url":"media/42e1114c70896cadb99e9bb9f76c60f3.jpg","caption":""},{"id":"f96a5d296a080ecf328d9f667d314723","url":"media/f96a5d296a080ecf328d9f667d314723.jpg","caption":""}],"title":"Cleaning Up Ice Sculpture and Lights","caption":"","file":{"id":"fa13000d486782e536c5ba36ef999ed2","url":"media/fa13000d486782e536c5ba36ef999ed2.webm","name":"Ending.m4a"}}]},{"id":"reflection","title":"Reflection","kicker":"","reflect":true,"suggest":["text","quote","photos"],"blocks":[{"id":"7cuurx51","type":"text","items":[],"files":[],"images":[],"heading":"","body":"I’ve never listened to a party. It was an odd experience. But I’m happy to have proof of the first and most interesting dinner party I have ever hosted, and to document my time with friends and strangers alike.\n\n\nPrior to this, I was ignorant of the typical nature of dinner parties. I’d seen them portrayed on TV, where there was usually red wine and a scandalous revelation. I’d also heard about them from my Nana and Grandpa, who were the most social people on Long Island, and later, in middle New Hampshire. They were, by my Mom’s accounts, avid dinner party curators. “We’re having three couples and Father Dan over” is a famous line from their rich hosting history. (For many years, in the post-Catholic childhood my Mom had created for us, I wondered why Father Dan didn’t have a plus one.)\n\n\nWhen I began to plan this dinner party, I realized that I have never had one, not for lack of knowledge, but for lack of motivation. Despite my general disposition, I find too much socializing quite unsavory. I’ve inherited this from my Dad’s side, who prefer solitary walks and solo travelling.\n\n\nIt’s manifested in my life surrounding this class. Sometimes, in the library at a hub for discussion, I’ll excuse myself.\n\n\n“Where are you going?” Antonia, a social friend of mine, will ask.\n\n\nMy answer is typically one of two, depending on how much work I have left to complete: “I’m going to touch grass” for when I need to come back eventually, and “I have to go home,” when I’ve done enough.\n\n\nI revealed to Alisa and Michael, the school's social butterfly, that sometimes, on a Friday night, I’ll go to the movies by myself. “That’s crazy,” said Michael. “What if Cecil wants to come?” Alisa asked. I shook my head. Cecil knows me, and he knows when I’m going to the movies alone.\n\n\nMaybe it's the variety in our capacity to socialize that helped humans thrive. Maybe, as an early human, I would have been a member who spent some time in the camp with the others and some time alone, picking berries, and the ratio is what I need.\n\n\nSo, you might see why it had never crossed my mind, besides for a family gathering, to voluntarily invite a crowd of people into my apartment for the purposes of more socializing. I sighed as I sent out the texts.\n\n\nOver the next few weeks, I became more excited, simply by the sharing that was already taking place in preparation. Willa, my roommate, and her friend cooked almost the entire dinner. My twin brother Matt planned to drive two hours to pick up Mim, who would later celebrate her birthday. Tomer, Willa’s friend whom I had only met once, asked his girlfriend Mina to come. And my friend Alisa said she could bring two chairs on the bus, along with her sister Karen, who would put aside her PhD application for the night.\n\n\nAt the party, surrounded by the equivalent of three couples and Father Dan, I was touched by the spirit these people brought in the name of my project. In the recordings and photos, I hope you can hear and see, beyond the muffled audio, the crash of the cake, and strange faces and drawings, the connection made between strangers for a shared mission: help a girl get her master's degree. At the end of the night, I could see why, as I wiped the remaining smudges of the cake from the floor, Nana and Grandpa were so fond of this.","body_h":"I’ve never listened to a party. It was an odd experience. But I’m happy to have proof of the first and most interesting dinner party I have ever hosted, and to document my time with friends and strangers alike.\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Prior to this, I was ignorant of the typical nature of dinner parties. I’d seen them portrayed on TV, where there was usually red wine and a scandalous revelation. I’d also heard about them from my Nana and Grandpa, who were the most social people on Long Island, and later, in middle New Hampshire. They were, by my Mom’s accounts, avid dinner party curators. “We’re having three couples and Father Dan over” is a famous line from their rich hosting history. (For many years, in the post-Catholic childhood my Mom had created for us, I wondered why Father Dan didn’t have a plus one.)\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>When I began to plan this dinner party, I realized that I have never had one, not for lack of knowledge, but for lack of motivation. Despite my general disposition, I find too much socializing quite unsavory. I’ve inherited this from my Dad’s side, who prefer solitary walks and solo travelling.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>It’s manifested in my life surrounding this class. Sometimes, in the library at a hub for discussion, I’ll excuse myself.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>“Where are you going?” Antonia, a social friend of mine, will ask.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>My answer is typically one of two, depending on how much work I have left to complete: “I’m going to touch grass” for when I need to come back eventually, and “I have to go home,” when I’ve done enough.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>I revealed to Alisa and Michael, the school's social butterfly, that sometimes, on a Friday night, I’ll go to the movies by myself. “That’s crazy,” said Michael. “What if Cecil wants to come?” Alisa asked. I shook my head. Cecil knows me, and he knows when I’m going to the movies alone.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Maybe it's the variety in our capacity to socialize that helped humans thrive. Maybe, as an early human, I would have been a member who spent some time in the camp with the others and some time alone, picking berries, and the ratio is what I need.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>So, you might see why it had never crossed my mind, besides for a family gathering, to voluntarily invite a crowd of people into my apartment for the purposes of more socializing. I sighed as I sent out the texts.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Over the next few weeks, I became more excited, simply by the sharing that was already taking place in preparation. Willa, my roommate, and her friend cooked almost the entire dinner. My twin brother Matt planned to drive two hours to pick up Mim, who would later celebrate her birthday. Tomer, Willa’s friend whom I had only met once, asked his girlfriend Mina to come. And my friend Alisa said she could bring two chairs on the bus, along with her sister Karen, who would put aside her PhD application for the night.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>At the party, surrounded by the equivalent of three couples and Father Dan, I was touched by the spirit these people brought in the name of my project. In the recordings and photos, I hope you can hear and see, beyond the muffled audio, the crash of the cake, and strange faces and drawings, the connection made between strangers for a shared mission: help a girl get her master's degree. At the end of the night, I could see why, as I wiped the remaining smudges of the cake from the floor, Nana and Grandpa were so fond of this.\u003c/div>"}]}],"shareTitle":"Sharing a Social experience","shareImg":null,"shareCap":"","tabs":true,"lede_h":"\u003cb>My Shared Social Experience: \u003c/b>“The Gala of Strangers” \u003cbr>\u003ci>Hosted a dinner party with people I know and people I didn’t know\u003c/i>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003cb>Mode of Documentation: \u003c/b>Audio recordings and corresponding photos\u003c/div>"},"interdependent":{"title":"Interdependent","summary":"Thirty years a New York City firefighter, and a driver for anyone who needed one.","lede":"My Shared Interdependent: “All in 35 Minutes' Work”\nVolunteered for Fresh Pond reservation\n\n\nMode of Documentation: Narrative timeline","cover":null,"sections":[{"id":"in-main","title":"","kicker":"","suggest":["story","text"],"blocks":[{"id":"fresh-pond","type":"timeline","title":"","items":[{"id":"6rp42tez","time":"9:35am","text":"Google Maps told me it would only take 10 minutes by bike from the library to the water treatment reservation, where Omar, the park ranger, has said to meet. I always leave a buffer for my significant lack of directional sense. Somehow, even with spoken guidance through my headphones, I can’t seem to navigate. On the second floor, I packed up my backpack slowly and then shoved it violently into the locker with absolutely no respect for any electronic or soft food inside. The state of that banana would be a surprise for later."},{"id":"qg3pc8uv","time":"9:40am–9:55am","text":"I was out of breath from trying to maintain speed and, shamefully, to maintain distance from the older man whom I passed. It was that strange dynamic on the road, when you’re about the same speed as someone else but you believe yourself to be slightly faster.\n\nOn the cruises down the hills, past the beautiful Victorian houses of Old Massachusetts money, the contact in my right eye shifted. I whipped my head around wildly, hoping force would move it back into the right spot on my eyeball. After a few minutes, I left it creeping up the right eyelid."},{"id":"yq19u5nj","time":"9:55am–10:00am","text":"Ten minutes later, I arrived in the parking lot of the water treatment facility, a landmark near the start of the trail. I parked my bike on an empty rack and found that aligning a key to its keyhole with only one eye was an expectedly frustrating challenge.\n\nI found the ranger station around the corner, where I used the foggy bathroom mirror to migrate the contact from my frontal lobe to the correct position."},{"id":"l8byxz0l","time":"10:01am–10:15am","text":"I looked around the ranger station, near the wide trail opening and back around the corner. I walked towards the pond itself, the tall cattails surrounding a wavy blue. The beauty of the day and scenery was inconsequential, though. I was too busy staring down every movement, from a bird or a crane or a walker. Just a woman looking for an unknown man in an unspecified location.\n\nAfter a few minutes, I read Omar’s email again: meet by the Fresh Pond trailer near the water treatment facility. The trailer, just a few steps from my email inbox, wasn’t gathering a crowd. I texted the number Omar had listed at the bottom of the page, and looked up at the sky. I would give them ten minutes.\n\nI looked around again, now more conscious of the beauty I ignored. The leaves and the sound of the waves gently shifting the plants that grow in the shallows. It reminded me of the lake my grandparents lived on, the tiny waves. I was tempted to lie down on the wet grass, to look up at the trees, and was bending down when I remembered there was the imminent presence of volunteers."},{"id":"5qvxesbq","time":"10:16am–10:25am","text":"A figure wearing a sweatshirt and a belted knife came from the building and walked towards me. I’ve never been so relieved to see a strange man carrying a weapon.\n\nSweatshirt never gave me his name, and never asked mine. He did tell me, though, that he’s been swamped with leaf blowing and pre-winter trail maintenance. I asked him, if I do say so myself, some astute questions about plowing, maybe with a hidden agenda of proving I was from the North. I wouldn’t want to be mistaken for someone from below the current latitude. “I could tell from your flannel and boots,” he said after I mentioned growing up with lots of snow.\n\nPlowing season is an emotional roller coaster for the park rangers. Sweatshirt preferred the way they scheduled it at his last job at the state of Massachusetts. He didn’t like it here because they don’t let you sleep in the cab of the truck. After twenty hours of navigating the pedestrians, cars, and buildings with a one-ton device attached to a heavy-duty truck, public works decided it’s best that you get in your own car and head back to your house before the next round of plowing in three hours. “I’m lucky I haven’t hit dozens of people,” he said.\n\nI had little right to judge. I felt the same about my biking practices. The week before I had flown off my bike and slid across the sidewalk. The week before that, I had nearly hit the Dean of the Graduate School of Education.\n\n“How do you stay awake?” I asked.\n\n“Red Bull.” He replied dully, snapping a large stick over his knee. I’ve never tried Red Bull, and I have a feeling if I did, I wouldn’t make it back for my next class.\n\n“Last year,” he continued, sensing my concern for his cardiovascular health, “I tried to thug it out, but I felt like absolute shit, and my whole fucking winter was ruined.”\n\nI nodded. I guess I’d give Red Bull a sip to save myself from feeling like shit and save my whole fucking winter."},{"id":"7hl332bw","time":"10:26am–10:29am","text":"A larger, older man, also in a sweatshirt, came out of the ranger station. He was followed by a woman, in a more official tan ranger jacket complete with a crest. It was stunning how slowly she was walking. I wondered if something had gone wrong.\n\nWhen their duo joined ours, they too skipped introductions and headed right into the weeds about issues they were having with the public works department."},{"id":"osoagrim","time":"10:30am–10:35am","text":"A parade of large orange pick-up vehicles pulled down the path and stopped at to chat with the older man. They cackled about something that had happened across the pond (a woman taken out in a stretcher), then pointed out a large white heron in the distance."},{"id":"bksz8wng","time":"10:35am–10:40am","text":"Eventually the public works people left, and the woman turned to me, as the only volunteer in the group, to reiterate that Omar was out sick. I nodded. The older man questioned me about being a student and whether I aligned with the institution I was studying at.\n\n“Don’t you feel bad that they have a building named after the Sacklers?” He asked me. I nodded. I wondered if anyone had ever defended the family who sponsored the opioid crisis.\n\n“No, no, but it’s a great school.” He waved his hands at me. He was unconvinced, and so was I."},{"id":"34jjcwgr","time":"10:41am–10:44am","text":"At last, another volunteer joined us. She was a tiny woman, around age 65, with a high voice and a Southern accent. “Where’s Amy?” she asked before offering a greeting. She wore a vest and cargo pants. I wondered who Amy was to this woman and about the groups aversion to offering names.\n\n“Oh, Amy has Lyme,” the Ranger said, shaking her head.\n\n“She got the bullseye?” asked Sweatshirt. The Ranger nodded.\n\n“Well, I believe it. She rolls around in fields all day,” the Older Man piped in. Amy sounded like my kinda gal, and I wished she were there."},{"id":"e2pomcvt","time":"10:45am–11:00am","text":"We had put bug spray around our pant ankles and left the older man began walking towards the edge of the trail. The pace was peculiarly slow. I think I could have taken four breaths between each step. I wondered what or who was causing the slowness; Perhaps it was like a Ouija board. The forces of all participants, including myself, determined the pace. I had a feeling, though, that it was a weakest-link citation, and that the only other member of my volunteer cohort was the cause.\n\nAlthough it was physically confusing to move my legs at such a pace, it gave the group of us—the four musketeers—time to catch up. Sweatshirt was from Massachusetts, Woman Ranger was from Indiana, and Volunteer was from Texas. Each of our favorite apples differed.","text_h":"We had put bug spray around our pant ankles and left the older man began walking towards the edge of the trail. The pace was peculiarly slow. I think I could have taken four breaths between each step. I wondered what or who was causing the slowness; Perhaps it was like a Ouija board. The forces of all participants, including myself, determined the pace. I had a feeling, though, that it was a weakest-link citation, and that the only other member of my volunteer cohort was the cause.\u003cbr>\u003cbr>Although it was physically confusing to move my legs at such a pace, it gave the group of us—the four musketeers—time to catch up. Sweatshirt was from Massachusetts, Woman Ranger was from Indiana, and Volunteer was from Texas. Each of our favorite apples differed."},{"id":"ca1dj93y","time":"11:01am–11:08am","text":"We crested a side trail towards the road, where we saw a man, with his pants half pulled down, stumbling near the bridge. The Ranger walked towards him, and Sweatshirt moved behind her. I followed Sweatshirt while Texan was looking at a bird in the tree, somewhere further back. After a few minutes of the woman ranger speaking to the man, who had sat down on the leaves, she turned around and gave a thumbs-up.\n\n“He’s alright,” she said, as she came closer. She had unzipped her jacket, and I saw she was pregnant. Growing another human is certainly a reason for a languid pace."},{"id":"m62f9p4e","time":"11:08–11:10am","text":"Ranger unlocked the shed and stepped inside with Sweatshirt. I looked over at Texan, who was still smiling up at the trees.\n\n“Do you play a horn?” she asked. I shook my head and wondered if I looked like I played a horn. \n\nThe rangers came out with two pitchforks and two wheelbarrows, each with flat tires.","text_h":"Ranger unlocked the shed and stepped inside with Sweatshirt. I looked over at Texan, who was still smiling up at the trees.\u003cbr>\u003cbr>“Do you play a horn?” she asked. I shook my head and wondered if I looked like I played a horn. \u003cbr>\u003cbr>The rangers came out with two pitchforks and two wheelbarrows, each with flat tires."},{"id":"9xc3pblw","time":"11:11am–11:20am","text":"We stood around a pile of mulch, 20 yards from the shed. The woman ranger explained we would be moving the mulch from here, down to any exposed roots found on the trails below. Covering them helps the tree retain moisture and maintain an underground system. Tex plunged her pitchfork into the mulch and began filling the barrow.\n\n“Amy would love this!” she said gleefully."},{"id":"ojsn281m","time":"11:20am–11:30am","text":"I quickly revealed myself as a contender for one of the strongest in the group. Woman Ranger was already out of breath from growing a life, and Texan was too joyful about the pile of mulch to focus, so it was down to me and Sweatshirt, to run the barrows up and down the hill. “Use your legs, not your back,” my Dad’s head repeated as I pushed the barrow with a completely deflated tire over bumpy terrain, keeping my eye out for any stragglers.\n\nAs I walked along, I dumped small piles here and there on the roots. I enjoyed patting it down, like tucking the trees in for bed. If there’s good karma to have with anything, it would be trees."},{"id":"57oxy49p","time":"11:30am–11:40am","text":"My alarm rang on my watch as I was cresting a hill further down the trail. It was a refuge, to be silent in the forest by myself. I dumped the remaining amount of mulch onto a large exposure of evergreen roots and used my foot to quickly spread it, pointing the single tire up the hill to let the ranger know I had to get back to class. As I explained, I wanted to let her know my class was far away from the Sackler building, but I damped the urge. She thanked me, and the Texan waved delightfully. I looked for Sweatshirt on my way back to the station, but we’d lost him a few rounds of mulch ago to an apparent root system deeper into the trail system."},{"id":"4rpaehks","time":"11:40am–11:45am","text":"I unlocked my bike and hooked my headphones over my ears. At that moment, Omar emailed to report that he was out sick."}]}]},{"id":"reflection","title":"Reflection","kicker":"","reflect":true,"suggest":["text","quote","photos"],"blocks":[{"id":"dmqwpv26","type":"text","items":[],"files":[],"images":[],"heading":"","body":"After my experience, I wondered, as I sped back to the library, whether I should have chosen a different opportunity. The experience of volunteering at Fresh Pond, as you can see from my timeline narrative, was not one in which I felt particularly useful to the park or the city of Cambridge. I only moved a few wheelbarrows of wood chips from one spot to another and was third in line to handle a possible medical emergency. Perhaps the food pantry or the reading programs for Boston Public Schools would have been more effective. I could have given my knowledge about literacy or my ability to lift over 25 pounds.\n\nWhile turning onto Brattle Street, I can give myself some grace. Formally giving service, although simple and positive in theory, can be difficult to maneuver. There is decision paralysis from the overflowing pot of ways to give. Then there is navigating the people or organizations and their values—whether their actions, and yours, are fulfilling the intentions.\n\nI once learned in a psychology class called “Human Happiness,” that altruism is a myth. Volunteering, the professor announced through Zoom circa April of 2020, must give back to one's psyche in one way or another. If it does not, it will have negative impacts and cannot be sustained.\n\nWhile at that time I’m sure I felt I could have done without that heap of cynicism, I understand the essential nature of it in adulthood, of being effective at caring for those in your life and community. My Grandpa pulled people out of burning skyscrapers for 30 years, not because he loved the terror of fire, but because he built a community around himself. He’d talk about nights in the firehouse, and about teamwork, about the great men and women he had the privilege to meet. He wasn’t giving to his community but becoming a part of it, bringing what he had to offer.\n\nI supposed that this was true of this October Thursday on a microscale. Spending 90 minutes outside with the tree and the smell of dirt is something that gives back to me. Meeting people, although nameless, from Texas and Indiana, young and old, near a trailer in Cambridge was a small act of integration into community, learning as much as it was giving.\n\nAs I sat in class afterwards, sweating through my flannel and smelling of DEET, I thought of the crew I had met. Maybe, for a brief time, they were my firehouse, all united in helping the community. While my work for Fresh Pond volunteers isn’t saving any immediate lives, it had what I needed to keep going back: an incorporation with community, however slow and brief it might have been."}]}],"shareTitle":"Sharing an Interdependent experience","shareImg":null,"shareCap":"","lede_h":"\u003cb>My Shared Interdependent:\u003c/b> “All in 35 Minutes' Work”\u003cbr>\u003ci>Volunteered for Fresh Pond reservation\u003c/i>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003cb>Mode of Documentation: \u003c/b>Narrative timeline\u003c/div>"},"emotional":{"title":"Emotional","summary":"Confetti in Brooklyn, a dance contest at 18, and “the best.”","lede":"My Shared Emotional Experience: “Remember Through Song”\nListened to and read about the emotional connections others have to songs\n\n\nMode of Documentation: Songs and narratives","cover":null,"sections":[{"id":"em-intro","title":"","kicker":"","addLabel":"Add above the songs","suggest":["photos","download","text","story"],"blocks":[{"id":"05o4hwdv","type":"photos","items":[{"id":"77cfe2928f42489c31c768fd63f92f03","url":"media/77cfe2928f42489c31c768fd63f92f03.png","caption":""}],"files":[],"images":[],"title":"Request Letter"}]},{"id":"em-main","title":"","kicker":"","suggest":["lyrics","spotify","audio","text"],"blocks":[{"id":"song-1","type":"lyrics","title":"Ride Like the Wind","artist":"Christopher Cross","lyrics":"","note":"I am listening to Ride Like the Wind by Christopher Cross, and it sends chills down my spine. I feel itchy and want to turn it off. I turned it off. It is just TOO annoying.  \n\nI feel: Edgy-Annoyed-Slightly Agitated-Disapproving-Disdainful\n\nThat song brings me back to high school gym class. We listened to that song for 45 minutes, three days/week for eight weeks. It was the aerobics unit. It was 1982.  \n\nFirst of all, gym class in high school gets me feeling edgy in general, even without the music. The rope you had to climb. Doing a pushup. Oh my God– the gymnastics unit!! It is so unfair to make an almost six foot high school girl put her long, skinny body upside down in the air – as in a cartwheel– in front of everyone. And, the hassle of changing clothes, possibly sweating in the middle of the day, which meant reapplying makeup AND hairspray, and trying to remember your sneakers on top of everything else, like your clarinet and your science project... I hated gym days.\n\nWe had a mean teacher for the aerobics unit, and she taught us the routine in a joyless way. She was a sour woman with short hair, a tiny head, a small waist,  and very wide hips. Learning the routine was repetitive and beyond boring, I was usually tired, often stressed, and always thirsty (we didn't really do water in the eighties.) And I felt in my bones– that this was a colossal waste of time. I knew I had better things to do (like read a book), and it all just felt so ridiculous. But, you had to pay attention because we were tested individually on how well we learned the routine. She sat there with a score card and marked points off if you forgot to touch your knee at a certain point, for example. \n\nAnd that song, ugh, played over and over, it was relentless. But, I like other Christopher Cross songs- like the one based on a General Hospital character, Think of Laura, and Sailing, and Arthur’s Theme, which is a great song! The other funny thing is I actually liked aerobics. I loved Jane Fonda and used to listen to her album and do the aerobics routines in my bedroom with my friend, Joanie. We wore leg warmers just like Jane. But the combo of that teacher, that gym class and that song. Thinking about it still makes my skin itch.","file":null,"link":"","len":"","spotify":"https://open.spotify.com/track/6sb8YsOx1jJYBYxxNRnxAI?si=8b12e80729f54a37","youtube":"https://youtu.be/Wd9rToNGTxk?si=zvFjxmRo0z53cLrM","image":{"id":"139f5d49e7c96dfa8753a2bd7b5ea4ac","url":"media/139f5d49e7c96dfa8753a2bd7b5ea4ac.png","name":"Screenshot 2026-11-13 at 2.25.40 PM.png"}},{"id":"k2jz43el","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/23Uv9xqLumDqEBNIdHhCcO?si=2ce025c3c1bd4a63","youtube":"https://youtu.be/EtLVXBqfqBY?si=EE9UyBccbDPjnAvC","len":"","title":"I Hope I Don’t Fall in Love with You","artist":"Tom Waits","lyrics":"","note":"My children have teased me that my Spotify station should be called “Songs that Make You Want to Slit Your Wrists.” I can see why they say that. I listen to this kind of melodic, reflective music when I’m doing one of my favorite things: cooking for others. The combination of my busy hands, the lyrics, and the peaceful vibe enters me, taking me out of my head and into my body. Embodiment is both a daily and lifelong goal, and music like this, walking in the woods with my dog, and being authentically in relationship with others all help me make that shift from mind to body.\n\nThe backstory of this song, for me, is that I discovered it around the time I met my second husband. We met later in life–I’d been single for almost a decade, raising my children with no interest or experience in dating. Meeting him on a dating app was a surprise and a delight. I didn’t necessarily plan or expect to partner again, and we met almost instantly after I created a profile on a dating app. (This means I still have no experience or interest in dating.)\n\nI’d reached a point where I felt happy and proud of the life I’d built, despite navigating some hard, strange turns the previous decade. In truth, I occasionally felt lonely, but I mostly welcomed this feeling, as it seems healthy and appropriate given human nature and the emphasis on partnership in our society. Life is for loving, right? Meeting my husband brought deep feelings of love, joy, and even hope into my life. But I was also cognizant of what I would have to change or lose by becoming somebody’s partner.  Letting go of my old life, where I’d solved all my own problems and answered my own questions, felt like a loss. This song helps me hold the tension of hope and loss in a conscious, felt way.\n\nI think that is the common thing about the songs I like. They make me feel more than one thing at the same time. Melancholy, for example, is one of my favorite emotional states because of its inherent complexity. And complexity feels embodied, which, as I said, is always my goal. My head is always busy thinking, but when I slow down, I find my body is a reliable emotional guide. Songs like this help me slow down and listen. Beyond melancholy, Tom Waits, generally, and this song specifically, introduces feelings of nostalgia, tenderness, and love. I welcome all those feelings, but when they arrive together, I feel a particular kind of peace and happiness.","image":{"id":"2a00b0e9640f6a96c03b566d0206d178","url":"media/2a00b0e9640f6a96c03b566d0206d178.png","name":"Screenshot 2026-11-13 at 2.24.44 PM.png"}},{"id":"vqj4voi8","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/0bmhoEzLbkL3qsaHU8Q4xZ?si=a77354c73c0d4989","youtube":"https://youtu.be/W1LsRShUPtY?si=udwlC0z5J-DRi1wO","len":"","title":"Old Time Rock and Roll","artist":"","lyrics":"","note":"There can be no other choice!  As soon as that introduction starts I am up and dancing.  It's a magic spell.  I smile. I laugh.  I'm joyful.  I am by myself. I'm uninhibited.  Uninhibited, me?  That's not usual, is it? It must be magic.  I want to sing the words out loudly.  I don't care that my head is moving to the beat in odd ways.  Nothing is in my head except the song.  When the song is finished, I'm still smiling.  It's an elixir.","image":{"id":"a96cf27f5a16b1eddea26b5a05f1ab26","url":"media/a96cf27f5a16b1eddea26b5a05f1ab26.png","name":"Screenshot 2026-11-13 at 2.23.03 PM.png"}},{"id":"pmfvdek5","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/4QTFU7BukoyDtyyemGPNCX?si=6f9efe97dbdd4d8e","youtube":"https://www.youtube.com/watch?v=G-QAhsbQYmE","len":"","title":"Dance of the Sugar Plum Fairy","artist":"Pyotr Ilyich Tchaikovsky","lyrics":"","note":"Tchaikovsky’s “Dance of the Sugar Plum Fairy” drifted in and out of my entire childhood. I did ballet for eleven years, and for all those years I performed in The Nutcracker. I was no ballet star, but I loved the costumes, the togetherness, the pointe shoes, and most of all watching the big girls dance. The song, when it plays, skipping and plucking through winter shops, makes me feels achingly nostalgic, but not because I miss ballet – although I do – but because it reminds me of the winters of my childhood. It reminds me of my dog, who ate ornaments of our tree and loved the fireplace. It reminds me of skittering, like the song, down an icy hill and my dad zipping past us on the ice rink. It reminds me of my mom’s careful wrapping and hot chocolate with three big marshmallows on top.  The Nutcracker was like a winter feast for the senses…the smell of hairspray as we pressed under Mother Ginger’s stilts, the slip of fake snow, the thwap of a pointe shoe against the stage…and most of all my family in the audience. My family who did not, I’m sure, want to see The Nutcracker eleven times in a row but who gushed, who asked me how practice went, who took pictures of me in my costume and who sat, attentive, eager in the audience year after year. I felt, then and now and always, completely held, completely cherished and wanted, completely loved. The song, as it slowly twirls and dips into a staccato celebration of winter drops me into the swish of tool, an impossible to return to nostalgia of childhood Christmases, and a reminder, a promise, of deep and joyful love from my family who were always, always in the audience.","image":{"id":"9b829cfda255d2bd5f256a829746b672","url":"media/9b829cfda255d2bd5f256a829746b672.png","name":"Screenshot 2026-11-13 at 2.32.47 PM.png"}},{"id":"b3w6l0v1","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/1K75LoddxhlcgwPByU4CaQ?si=6c0089733df641c4","youtube":"https://youtu.be/cKiI00gaPZM?si=-Yq7Fp-ILDn2eMRh","len":"","title":"thoughts i have while lying in bed - with Beach Weather","artist":"The Maine","lyrics":"","note":"A song that elicits emotions from me is “thoughts i have while lying in bed - with Beach Weather” by The Maine (ft. Beach Weather). When this album first came out, I immediately gravitated towards this song. The whole album is fantastic, though. \n\nThis song in particular makes me wiggle and sway in a variety of ways: my head moves side to side, my shoulders wiggle back in circles, and at some parts my free hand moves like a wave (I’m usually driving while listening to this song, so my other hand is on the wheel). Sometimes I fully sing along, but oftentimes I just want to hum, so I can hear it better but still participate. There are parts where there are strategic pauses. I pause at those same times and resume bopping when the beat comes back. \n\nIf I had to pick words to describe how this song makes me feel they would be: vitalized, vibrant, tender, pulsating, and sinuous. Vitalized and vibrant are inspired by the beat. Tender comes from the lyrics, which are about someone finally accepting that they are in love with someone even though they are a little afraid to be. Pulsating and sinuous comes from the dynamic nature of the multiple layers of instrumentation. \n\nThis song is also attached to a good memory. I got to see much of this album performed live at their Sweet 16 tour. For this song, I was able to whole-body wiggle, sway, pause, and bop. I wore a sequin skirt because disco balls were a prominent feature of the marketing for the album and the tour. It was very cold on the walk to and from the car on the winter streets of Boston, but I was still pumped because I got to hear this song.","image":{"id":"f1c33aa09653f5ae3135cacae79f0aa5","url":"media/f1c33aa09653f5ae3135cacae79f0aa5.png","name":"Screenshot 2026-11-13 at 2.34.28 PM.png"}},{"id":"e4o9jeu7","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/3fQ5zC4aLynBpXqL8tswID?si=e33a66fa7fb241f7","youtube":"https://youtu.be/ztDPAHHtPMs?si=tR75Q5sXfuclUtLt","len":"","title":"Return to Pooh Corner","artist":"Kenny Loggins","lyrics":"","note":"Grateful, Nostalgic, Melancholic\n\nThe song that came to mind when you asked me to help with this project was Return to Pooh Corner by Kenny Loggins.\n\nListening to this song has always brought a lump to my throat. I have the clearest memory of driving on a beautiful fall day with my baby boy in the car seat beside me (yes, babies sat in the front seat in 1996!). I remember feeling like I had won the lottery. A healthy baby, beloved friends and family surrounding us, I was happy in a way that was almost impossible to put into words.\nAs the years went by and I added more babies to the car,  I felt like I was exactly where I was supposed to be. My days were full, sometimes chaotic, often exhausting, but I knew how lucky I was to be living them.\n\nWhen I hear the song now, I feel an overwhelming sense of missing my little people. I miss the conversations in the car, the endless questions, and the ordinary moments that I didn't realize would one day become some of my most treasured memories.\n\nThese days, when the song comes on, I'm usually alone. And it's almost as if a little museum of my time as a parent opens up inside me.\nI remember hysterical laughter while running around in a bumblebee costume. \nBooks read together in bed at night. \nPudgy little hands tucked into mine. Kissing those sweet baby necks. \nThe way your eyes would lock onto mine as they stepped off the school bus, eager to tell me about their day.\nAll those little moments. So ordinary at the time, yet so special in retrospect.\nI think what makes this song so emotional for me is that it takes me back not just to my children when they were little, but to a time when I was living right in the middle of something I would someday miss.\n\nI wouldn't trade those years for anything. And I wouldn't necessarily want to go back and live them again. \nBut I do miss them. I miss the noise, the closeness, the little hands, and the privilege of being your whole world for a little while.\nThe ache of it  is both joyful and sad. It's gratitude for having had something so wonderful, and melancholy for knowing that season has passed.\n\nMaybe that's what this song gives me: a chance to visit that little corner of my life again, to remember how lucky I was, and to feel, if only for a few minutes, that I'm back there with them.\n","image":{"id":"2eb10cc32a99e77769625becb96488a6","url":"media/2eb10cc32a99e77769625becb96488a6.png","name":"Screenshot 2026-11-13 at 2.36.39 PM.png"}},{"id":"yrpxx40d","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/2bV4NwncWMnVvcWyU2yxwB?si=c30372a0ca994b79","youtube":"https://youtu.be/RuFoTayOR6E?si=aR0JeShMy-qfyD-Z","len":"","title":"hole in the bottle (with Shania Twain)","artist":"","lyrics":"","note":"For my reflection, I scrolled back into my Liked Songs and stopped in the section that I knew represented mid/late 2021. I think it’s important to know that I almost exclusively listen to my Liked Songs. I don’t make playlists, but what I do is if I just LOVE a song obsessively, I slap it into the Liked Songs and just shuffle it every day.\n\nThe song I chose is called “hole in the bottle (with Shania Twain)” by Kelsea Ballerini. It’s a silly-ass song. The song has Kelsea Ballerini singing about how there’s a “hole in the bottle of wine”, and she laments that every time she goes to have some wine, the bottle is empty because it has already leaked out through the hole. IT’S A JOKE. The hole is at the top. Shania Twain does a little celeb appearance, and had a role in the interstitials between the bridge and the chorus. I love this song so much. I’m not sure if I’ve ever told my sister Jenny that I love this song, although it’s plausible that I’ve made her listen to it over and over and I’m just forgetting that.\n\nI chose this song because it makes me think of the fall after I graduated college. I graduated in three years because I was fixin’ to get out of college because it was Covid times. I ended up having a pretty good ‘senior’ spring at college, but then the day after graduation, I hopped in the car and drove 14 hours home to start grad school in the summer term. Halfway through that summer, I just couldn’t do it! I was burnt to a crisp, school-wise, and I could tell I was just dogging it through, not really learning. So I took a job I had heard of doing educational outreach at a biotech company in my city. \n\nIt was a big season of change for me because I had not ever really ditched something like I ditched grad school. It didn’t really fit into the image I had of myself as an academic weapon; I was happy to be getting out but I didn’t really know where this left me. Also – the job I started was bonkers. I was one of three people in the department, and by two months in, both of them had quit because they hated each other so much, leaving me, the twenty-one-year-old, in charge of workforce development for a biotech company. Huh??? I was doing a weird, bad job but it was good enough because they had a warm body in the cubicle.\n\nANYWAY. This song by Kelsea Ballerini featuring THE Shania Twain is kind of important in representing this season of my life. It makes me feel happy and content, because I associate it with the time in the fall when I had settled into my job, was making young fun friends at work, and had a very doable schedule living in a place I liked. I remember feeling like the cubicle work was so easy compared to the academic grind I was in just mere weeks earlier. It was more complicated in many senses, but so much more measured. Also, I am an extrovert, and I think part of this contentedness was due to my new social connections coming out of Covid. Yay! Fun!!! A lot to navigate socially and a lot to get used to in terms of learning about the world of work, but I loved my work friends and I loved my routine.\n\nI think about my adult life in phases, and this one is important. From senior year of high school through the fall of my senior year of college was one distinct phase, and then from senior spring through the end of my first year of work was the next. Falling into a routine outside of my home and feeling like I had a big boy job with friends and a salary brings back a warmth to my brain that feels so simple and happy right now. I guess that’s how it goes, though, right? Like, if I’m looking back on that time as feeling simple and happy right now, I guess I’ll feel the same about now in a few years. That time was far from seamless, but I look back on it and feel proud of myself as a young person and the foundation I was able to lay for myself. I guess I’m also feeling grateful that I have a generally positive self-image, and that I look at my past through rose-colored lenses.\n\nTake a listen to “hole in the bottle (with Shania Twain)” by Kelsea Ballerini. Hopefully it’ll remind you of being a young person and feel proud of yourself like it did for me.","image":{"id":"a8f0342b97615fed0b5fd6984e42b54c","url":"media/a8f0342b97615fed0b5fd6984e42b54c.png","name":"Screenshot 2026-11-13 at 2.38.38 PM.png"}},{"id":"v7pq2kel","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/5LABCxgmP7DATATIJXOh6n?si=e7cf19fbd3884e65","youtube":"https://youtu.be/5bRDGQAUag8?si=XCE-s43Khabmatyf","len":"","title":"Ever Since New York","artist":"Harry Styles","lyrics":"","note":"My emotional reaction to this song has changed dramatically since hearing it performed by Mr. Styles just last week! It was the first time he sang it at a concert in the past 4 years. In particular, the opening 20 seconds of instrumentals will now trigger the feelings of shocked amazement I felt at the concert since the song was not on the setlist and it was a complete surprise to hear it. Similarly, the final 43 seconds of instrumentals now reminder of the sense of grateful fulfillment I felt at the show having witnessed something so special. I'm happy to have this song be a sort of time capsule for me to revisit my feelings from the show.\n","image":{"id":"1ed558f221d6654cc5af27f628a6356a","url":"media/1ed558f221d6654cc5af27f628a6356a.png","name":"Screenshot 2026-11-13 at 2.44.49 PM.png"}},{"id":"5jiwylcw","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/4VUEpBFCSO1Ro4J50O6hyZ?si=6530c93a47934d60","youtube":"https://youtu.be/QA4NefASIc8?si=Wb2TXSM_L8UlJAr1","len":"","title":"Ma Tnsani (Yalla Habibi)","artist":"Vanco , Tiesto, AYA","lyrics":"","note":"I think the reason music is so good at capturing emotions is that it also captures a moment in time. \nThis song will always take me back to the month before Goldie was born. It is a typical weeknight: it’s 1:00 am and I’m opening the door to the freezing cold garage to cut some adjustment to the 2x4s I’m using to frame out the new room in the house to prepare for baby’s arrival. We don’t know when she will arrive, and we don’t know if it’s a he or a she, so all I can do is keep working to make sure I finish in time, hence the late nights. I know I’ll wake up at 6 and get a few more hours of renovations before I go to work. I am exhausted, and I know that the end is not near, and I know tomorrow and the next day I will also be exhausted. I also know I can keep going. I wonder what kind of person I am, what kind of person I’ll be as a father. I can smell the silicone of my ventilator. There’s an inch of sawdust on the ground. I try to step quietly, my wife is nine months pregnant and asleep upstairs. But the miter saw, or the nailgun, or the sander can’t be quiet, and the project must go on. But in my noise cancelling headphones, the huge rumbling bass is both ominous and dreadful and motivatingly repetitive. It’s energizing, but in a fear inducing way. We don’t know who we are waiting on- we didn’t know the gender or name in advance- so we called the impending baby “habibi”, Arabic for “my beloved.” That fact also made this song a joyful one, one of anticipation and unknowns and excitement. But I am cold and exhausted and I’m still cutting plywood in the ice cold garage. The very opening notes still give me this physical response to this confusing, two sided emotion.","image":{"id":"6b937770c026a2dac3ac5474235f9a4a","url":"media/6b937770c026a2dac3ac5474235f9a4a.png","name":"Screenshot 2026-11-13 at 2.51.21 PM.png"}},{"id":"vfm64yor","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/6raYznZkOrvB3n7B2Ur3zr?si=d0e90010aa124f0d","youtube":"https://youtu.be/r6DU15rWnJs?si=_OGX_WVirYysyXQv","len":"","title":"It's You","artist":"Ninajirachi, daine","lyrics":"","note":"Suspense, mystery, ethereal, movement, forward momentum, rising, swelling… \n\nIt’s a complex, melancholy feeling that isn’t just one thing or another. But now the pace and energy is slowly evolving, and I’m realizing there’s joy too, and the energy and joy is increasing. I’m think about how the Buddhist concepts of sukha and dukha are two sides of the same coin. And now I can feel a fascial release, some sort of nerve excitement, a tingling in my arms and fingers, and now I’m head banging and stomping the energy is infectious but also there’s still a fuzzy dark feeling. \n\nI previously wrote this about this song: \n\n\"Good music captures emotions that are hard to describe. Ninajirachi makes catchy, loud, aggressive, sensitive EDM; music that is simultaneously pop-y and incredibly not radio friendly (case in point, her song “F*** My Computer”). I am in awe of her most recent album, “I Love My Computer.” It is rare in the world of electronic dance music for an album to work as a cohesive whole; it’s far more common for an EDM DJs to compile a cash-grab attempt of miscellaneous singles and call it an album. Even rarer still for the artist to write, sing, and produce their songs themselves. And the songwriting is good: In a world of you’re-sexy-and we’re-at-the-club lyricism, Ninajirachi writes about getting rejected in school music class, her spiritual connection with her cracked iPod, the bizarre perils of the deep internet, and complex relationships. The chorus of “It’s You” goes: \n\n“Need you to pick me up / spin me around in your life / when I see the truth I cry / when I think about it, I cry … It’s you, it’s really you.” \n\nWhich is followed by an ominous, heart-rattling pulse-wave synth line drenched in her signature static. As the listener, the words and the music are colliding like the \n\nTitanic to the iceberg. It’s a love story, but there’s sadness, but it’s a fist pumping club banger. What are you supposed to do with that? That’s a complex emotion. \n\nWhen to listen: at high volume, at the gym, on a run, or 5:00pm on a Friday if it’s been a long week. \n\nI love this song because the emotional tone is a color, not grayscale. It’s a feeling that is hard to understand or even process, it is not a simple experience.\"\n\nThe lyrics, I later learned, are “lies” not “life.” But I always hear at as “life,” and I like thinking about this song as this confusing, desperate madness when you realize there is someone you love like no other. \n","image":{"id":"f695a4383a0bc66517da06914444070f","url":"media/f695a4383a0bc66517da06914444070f.png","name":"Screenshot 2026-11-13 at 2.53.33 PM.png"}},{"id":"771k4xi8","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/0SCkN2QprWk02svK0HCZ2n?si=3a10c31eba424153","youtube":"https://youtu.be/veZaHimbtaQ?si=2S3kE3ln-ZcbX4Fc","len":"","title":"Bück dich","artist":"Rammstein","lyrics":"","note":"I am clenching my fist, and furrowing my brow. Clenching my jaw. I want to do something really hard and repetitive and feel exhausted afterward. There are screams in the background that scare me. I don’t know what is being said, but I know it’s NSFW. The deep, organ like voice has a trancelike black magic, I feel like I’m being compelled to do his bidding, like a curse is being cast down onto me, like I’m alone in an abandoned church on a mountaintop. My heart is beating faster. I want to throw something, or slam something. \n\nI remember this song came on shuffle one my commute to work one day. It was a beautiful fall day, and I was walking past the 9/11 reflecting pools, and everyone else was scurrying to their jobs all around me, and the sun was shining, and no one knew what I was experiencing, and the strange dichotomy of that moment made me happy. \n","image":{"id":"11dbd17bcefb79b2767bbae7cf7645f6","url":"media/11dbd17bcefb79b2767bbae7cf7645f6.png","name":"Screenshot 2026-11-13 at 2.55.15 PM.png"}},{"id":"0tgauye8","type":"lyrics","items":[],"files":[],"images":[],"spotify":"https://open.spotify.com/track/64SiDhf7ZcIX9sqpEWLSz1?si=6136b904fafe41fa","youtube":"https://www.youtube.com/watch?v=FmlDpcg6X4A","len":"","title":"Islands (Really Something)","artist":"Whitney","lyrics":"","note":"Sinuses are acting up, behind my eyeballs, somewhere behind my brow. I feel the pressure in the back of my eyes, like they’re going to start getting wet. \n\nLife goes on, but now I feel like my throat is closing a little bit, and swallowing is a bigger effort than it was a few moments ago. I am thinking about what it will be like to be on my deathbed. I am wondering what I’ve accomplished. I am wishing that that I have made as much meaning as I could have, an overwhelming amount of emotions and experiences and people and love. \n\nI am thinking about when I got married, and the first moment being alone after the ceremony, in a green hotel hallway, feeling like I was living in a dolly zoom, like the world was moving through me, not the other way around.\n\nI am thinking about when I saw them play this song live in an old school assembly hall in Kingston. Everyone in the crowd was still and quiet, and there were waves and waves washing over us, some kind of feeling or energy that even my expensive monitoring headphones can’t capture.\n\nI want to cry, but it’s not clear that I’m sad. It’s lots of these big feelings that I don’t have names for. They feel like they’re coming out of the top of my lungs.","image":{"id":"d230347fa8275e1d8f81b69c43e31c5e","url":"media/d230347fa8275e1d8f81b69c43e31c5e.png","name":"Screenshot 2026-11-15 at 11.15.37 PM.png"}}],"carousel":true,"wide":true},{"id":"reflection","title":"Reflection","kicker":"","reflect":true,"suggest":["text","quote","photos"],"blocks":[{"id":"amqso30k","type":"text","items":[],"files":[],"images":[],"heading":"","body":"Of all the domains, I was the least excited to tackle this one. Firstly, it’s sensitive to ask others to share their emotions blatantly with you. Second, the energy behind having an intentional emotional experience is downright uncomfortable. Manufactured emotions are often hilarious, but if done incorrectly, also distasteful. It’s the reason why I both giggled and had chills watching Nathan Fielder chat with Elizabeth Holmes on a couch.\n\nLuckily, I’ve avoided any wide-eyed manipulation here, and my participants were beyond generous. Listening to and reading these reflections on emotion inspired by music has been the highlight of my project. Maybe, as I said in my letter to participants, it’s the innate human need for music. But it was the explanation that really touched me. Two of the participants cried while talking about their songs. Another one screamed with excitement over the phone. \n\nFor me, one of the most moving parts was reading these letters and recognizing my people by their writing. Even when they became detached from their names on the website, I could tell, from the way it felt to read each reflection, the vocabulary, the pacing, the history that comes through the writing, who they were. They gave me a gift: the feeling of really knowing them. \n\nIt makes sense that the importance of sharing is most potent in this domain. These stories are so far away from anything that can be replicated by technology. I think and hope that anyone could tell, even from reading about the experiences of people you don’t know, that this collection can only be achieved through the sharing of rich lives, lives that require us to feel melancholic and complex; magical and uninhibited; cherished, wanted, and completely loved; vitalized, vibrant, tender, pulsating, and sinuous; grateful and nostalgic;  edgy-annoyed-slightly agitated-disapproving-disdainful; bonkers and obsessed and happy; anticipatory and confused and excitement; suspense, mystery, and ethereal; exhausted and happy; euphoric, restless and satisfied.\n"}]}],"shareTitle":"Sharing an Emotional experience","shareImg":null,"shareCap":"","lede_h":"\u003cb>My Shared Emotional Experience: \u003c/b>“Remember Through Song”\u003cbr>\u003ci>Listened to and read about the emotional connections others have to songs\u003c/i>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003cb>Mode of Documentation: \u003c/b>Songs and narratives\u003c/div>"},"sharing":{"title":"Sharing the Sharing Project","lede":"","cover":null,"sections":[{"id":"rs-main","title":"","kicker":"","suggest":["text","download"],"blocks":[{"id":"oayfcqed","type":"text","items":[],"files":[],"images":[],"heading":"How","body":"During this master's degree course, when I developed The Sharing Project, I was challenged by my peers and myself: For whom can I share the Sharing Project? Why? How? What audience? \n\nI was getting hungry during the feedback session, so I wanted to say, “LEAVE ME ALONE. Cool it on the questions.” But I reined myself in and typed out their wonderings to address later.\n\nI considered trying to answer myself, but I knew they would fall in part to, as is typical, my twin brother, the person with whom I share the most. Matt works in a public high school in New Hampshire, running the Extending Learning Opportunity program, which serves as a way to link students with community partners. It helps them explore what it means to be in the community and what they might want to do after graduation.** \n\nMatt works with an age group for which sharing between peers is deeply essential (Blum, 2023). Yet he has seen addiction to phones, and increasing demotivation and mental health effects. Even when his students are part of experiential learning, when they can leave the school to work on something they are passionate about, there is a lack of excitement to connect with others. He has seen social media, screen time, and AI take over the work and the social life of a high schooler.\n\nNot that I don’t believe the man, but the numbers don’t lie. Teenagers are people who suffer the most from loneliness or feelings of disconnection from others: Globally, they are the loneliest population in the world (World Health Organization [WHO], 2025). Loneliness can increase a person's risk for depression, dementia, and heart disease (Shankar, 2023).\n\nThere is a mountain of research about this, and it’s a depressing climb. A lot of abstracts and research papers. You can read countless books, namely The Anxious Generation, about the effect of technology on the current teens and beyond. (They say research is “me” search, and I believe it.)\n\nOne afternoon in October, I brought my idea to Matt. It was in the spirit of feedback from an educator currently working in a school, but also because I just wanted to chat with him. “You guys aren’t going to get anything done,” said a friend when I mentioned the meeting with him.\n\nShe was half right: I clicked into the video call while outside on the bench and he declared, “Good Morning Harvard University!” He was in his office, with the whiteboard in the background and his familiar slanted handwriting. I immediately launched into describing the horrid stench of the fruit dropping from the tree branches above me and onto my head and laptop. He had his own agenda, urging me to give him a compliment about how great his blue light glasses look on him. “I already said they look good!” I screamed across Radcliffe Yard.\n\nEventually, though, I introduced the idea of converting this project into one that could be implemented in a high school. My experience in sharing in the domains my Grandpa lived so fully was a super-connecting one, one that had greatly increased the number of social interactions I had. It aligns thewith  research, which says connections like these buffer for loneliness and its detriments (WHO, 2025).\n\nAs I explained my idea, I could see him trying to work with me. He made suggestions and did have“yes, and,” but you can’t hide your thoughts when you shared the womb. With so many words, he conveyed that this version of my project would be hard to implement. Students, especially those who would need it the most, who are the most demotivated and disconnected, would be least likely take to the current design I explained.\n\nI worked with him on how to possibly reach this population. He gave me ways in which students could be assessed from a framework he developed, and perhaps an advisory initiative or a wellness curriculum could be most feasible for implementation. At the end of the call (I needed a snack), I felt hungry (hence the snack) and also certain that I was not capable of creating this curriculum. Theory felt way too far away from practice.\n\nAfter a donut and a cup of hot cider, I reflected on the meeting. It’s always disheartening to know you are far away from a goal, and to not be able to reach the audience for which it needs it the most. But I’ve learned that this is the challenge and joy of design, and happily, the motivation of the project. The need to work with community, educators, and learners to create. And for this, I need more partners in education, in both theory and practice, to share this with.  \n\nI’ve done my best to create a small outline, a nascent idea, for a lesson structure inspired The Sharing Project portfolio. I am sharing it with others in hopes that others might also be able to reflect on what sharing means in these five domains, to have such a rich and delightful experience as I did, and maybe how to reach those who are most affected by a lack of sharing. I hope they think of people like my Grandpa and niece, who can share across time and space in a more connected world. I hope we can work together.\n\n**Matt is very good at his job. He won the Edie for it. It’s like the Oscars of educators. I was at the ceremony, and I wore an outfit that looked like I was a little boy on the Titanic.","body_h":"During this master's degree\u003cspan style=\"font-size: 1.2rem;\"> course, when I developed The Sharing Project, I was challenged by my peers and myself: For whom can I share the Sharing Project? Why? How? What audience? \u003c/span>\u003cdiv>\u003cbr>I was getting hungry during the feedback session, so I wanted to say, “LEAVE ME ALONE. Cool it on the questions.” But I reined myself in and typed out their wonderings to address later.\u003cbr>\u003cbr>I considered trying to
