it arrived, Alisa let out a sigh of relief. “It’s not as red as I thought.” \u003cbr>\u003cbr>After my first bite, I nodded at my friends and gave a thumbs-up. Alisa’s shoulder untensed. Jenn shouted words of encouragement, like I was a marathoner in the last few miles. \u003cbr>\u003cbr>Over dinner, I learned about all the foods my friends grew up with, and the restaurants I should try. There was too much to do in too little time. All I know is that next time, I will order my dry pot with “medium spice.” "},{"id":"thix7t7f","type":"photos","items":[{"id":"ea96b67339a8f5e0284956a54e58831b","url":"media/ea96b67339a8f5e0284956a54e58831b.jpg","caption":""},{"id":"1b52f216cf0ba78d5bfa6364fb677f93","url":"media/1b52f216cf0ba78d5bfa6364fb677f93.jpg","caption":""},{"id":"a2c85c8085460547ff71dcf5ad1b82cf","url":"media/a2c85c8085460547ff71dcf5ad1b82cf.jpg","caption":""}],"files":[],"images":[],"title":"Real-Time Notes: Jenn"},{"id":"j9fe24cz","type":"photos","items":[{"id":"5c454a5c55af1ad11da9e31ae5f4d203","url":"media/5c454a5c55af1ad11da9e31ae5f4d203.jpg","caption":""},{"id":"626842f6576785e2a4f9a4802e05fbb0","url":"media/626842f6576785e2a4f9a4802e05fbb0.jpg","caption":""},{"id":"a1127444f4ab67261c976c4e7363c440","url":"media/a1127444f4ab67261c976c4e7363c440.jpg","caption":""}],"files":[],"images":[],"title":"Real-Time Notes: Alisa"},{"id":"8iszt6bb","type":"photos","items":[{"id":"7c6e456dd3c91f33f56fbff823c65e71","url":"media/7c6e456dd3c91f33f56fbff823c65e71.jpg","caption":""},{"id":"36e680e0faaecc72e492a8cf8355f002","url":"media/36e680e0faaecc72e492a8cf8355f002.jpg","caption":""},{"id":"b3d9d1a704aa054e813855d5907d773f","url":"media/b3d9d1a704aa054e813855d5907d773f.jpg","caption":""}],"files":[],"images":[],"title":"Real-Time Notes: Jenny"},{"id":"vugwvpgs","type":"photos","items":[{"id":"d85ee41029f554f5a794e8811e01cc57","url":"media/d85ee41029f554f5a794e8811e01cc57.jpg","caption":""},{"id":"7f6edf87e84a1f3a6c89f0286c82a1cb","url":"media/7f6edf87e84a1f3a6c89f0286c82a1cb.jpg","caption":""},{"id":"7245bad8b52e6477956f7c4dbb38d787","url":"media/7245bad8b52e6477956f7c4dbb38d787.jpg","caption":""},{"id":"c31ed2d2b1fe6960835cf76d0b3b09e5","url":"media/c31ed2d2b1fe6960835cf76d0b3b09e5.jpg","caption":""},{"id":"49f34df40f0ad625cdcf43d940cf5396","url":"media/49f34df40f0ad625cdcf43d940cf5396.jpg","caption":""},{"id":"ba554dd8afc561d16be712857b5f67f4","url":"media/ba554dd8afc561d16be712857b5f67f4.jpg","caption":""},{"id":"7078884e5fe5c087720d09dea034879d","url":"media/7078884e5fe5c087720d09dea034879d.jpg","caption":""},{"id":"12422301664442061db86cedc575404f","url":"media/12422301664442061db86cedc575404f.jpg","caption":""}],"files":[],"images":[],"title":"Photos"}],"exp":"My Shared Gustatory Experience: “A Brave New Spice”","expDesc":"Tried a new numbing Chinese spice","mode":"Written Reflection, Photos, and Notepad Thoughts","mode_h":"Written Reflection, Photos, and Notepad Thoughts","exp_h":"\u003cb>My Shared Gustatory Experience:\u003c/b> “A Brave New Spice”","expDesc_h":"\u003ci>Tried a new numbing Chinese spice\u003c/i>"},{"id":"smell","title":"Smell","kicker":"Olfactory","suggest":["text","photos"],"blocks":[{"id":"ecdtphuu","type":"text","items":[],"files":[],"images":[],"heading":"","body":"It had been a busy week of school and work. Mostly, I was tired because I had spent the previous night watching Florence Pugh play Kathy in East of Eden, haunted by imagery of a woman dying of botulism in her arms. Either way, I was looking forward to waking up late, shuffling out of bed at 10:30 as my younger peers preferred. Nowadays, though, I can never sleep that far into the day. Plus, the smell of marijuana smoke found its way through my open window and into my corner, third-floor bedroom and brought me back to junior year of college, when I lived above a pothead who made music deep into the night. Eventually I got used to the skunk smell, which filled my room, and created an air circulation system in which it was dampened by my pine-scented air freshener and also pushed away by my fan facing outwards. \n\nI rolled my eyes and noted the irony of starting my day of olfactory exploration with a smell I hate most deeply. My eyes barely opened; I flipped onto my stomach, and my nose was deep in the smell of my freshly washed sheets. I could turn this around.\n\n Then, after writing the alphabet with my foot to cure the dual maladies of both plantar fasciitis and tendonitis, I slid orthopedic slippers on and ran to my phone to see whether my sister-in-law had the baby we were all so readily awaiting. No such luck, even a day after her due date. I threw the phone back down on the floor like a bad sport and shuffled to the bathroom. \n\n***\n\nWhen I made my way to the front of the apartment, the smell I wait for all year hit me. The decaying leaves and the slowed, cool air. I could taste the apple cider and hear that low-voiced singer from Gilmore Girls sing “la la la la la la” in the background. I was inspired to lean my head out of the window, like I was Lorelai herself, but my face was promptly stopped by the screen. The small wires left a checked pattern on the front of my nose, and the charm I had briefly captured was gone. \n\nI tried to get it back. No one could say I wasn’t working hard to embrace New England autumn if I made pumpkin bread for friends who were coming over to carve pumpkins in a few hours. \n\nMy baking process was slowed twofold. My roommate was sleeping in the next room, so I had to make sure to place the metal baking bowls down onto the counter gently. Plus, I was still in the getting-to-know-you stage with the kitchen; guessing which drawers the teaspoons and measuring cups were in and how quickly the oven burns the bottom of a baked good. I became irritated by my chronic incorrectness. The spices back in the second drawer down on the left (the way it should be!), NOT on the shelf to the right. “It’s like I don’t even know you,” I said to its white counters.\n\nEventually, the bread was baking and my tea, the warm and bitter Irish breakfast, was in my hands, and my friends arrived. \n\nAlisa brought coffee from some bakery I had never heard of. I like the smell of coffee but not for the promise of drinking it. Caffeine in my body wouldn’t help anyone. Besides, I told Alisa, “It tastes like toasted garbage.” I like the smell for the reasons one might like a gentle piano song or a crackling fire. When it’s happening, someone is taking the time to enjoy something. \n\nAntonia brought gigantic pumpkin muffins, which I accepted with a smile. “Why did you bring these?” I said in a teasing tone, but wondered if she was already making assumptions about my baking abilities. To be fair, she had asked me what to bring over texts about five times, and I eventually responded, “MONSTER ENERGY,” which, based on my intolerance for coffee, might send me to the ICU.\n\nI was proud to guide them into the warm air filled with ginger, cloves, and cinnamon. Maybe, as I do with many people on a positive and negative dimension, they would assume that this is the way my apartment always smells. Smell is important to an impression of a space or a person…we all know someone who has made a bad impression simply by smell. \n \n“Well, next time you could tell me what you are making!” Antonia said as we admired the steam coming off the top. I protested that I had, but that I would be equally excited to have the pumpkin muffins, which had a leg up on my bread in terms of the large crystals of sugar.\n\n*** \n\nEventually, after dilly-dallying around, moving the pumpkins from the marijuana smelling porch to the inviting pumpkin spice interior, I cut the top of one. “Whoa,” they both said, stepping back as I plunked a huge Cuisinart knife into the orange flesh. (I wondered, to myself, what brand of knife was used most in violent crimes.) When the top came open, I inhaled. It smelled of the earth, like the fire in my family's fireplace, like the smell of trick-or-treating, of sitting on the porch with my Dad, the tractor, of running cross country.\n\n“This reminds me of childhood,” I said with a knife in my hand and a huge smile. \n\nAntonia sliced open the third pumpkin, pulled off its top, and revealed a rotting brown interior, complete with a pool of putrid, murky water. \n\n“YUCK, yuck, yuck, yuck,” I said as I took it between my forearms and walked it to the kitchen, where I debated what to do with it, spinning in circles between the sink and the back door. I was advised to place it on the porch where I had the displeasure of smelling it briefly—it reminded me of death, not of leaves, but of something more complex and dark. This isn’t a Girlmore Girls world anymore, I thought, sliding the pumpkin to the corner, having a great urge to drop it off the side. I wanted it gone, but mostly to see it splat onto the sidewalk. It would be like those pumpkins in that show Pumpkin Chunkin, a show that aired in the 2000s.\n\n***\n\nMy roommate Willa let me know the rotten pumpkin was gathering flies shortly before I left. She put the fate of the gourd gently, “Just wanted to let you know, it will be gone by the end of the day.” I nodded and lifted it carefully into the trash bag so as not to spill the brown juices all over me. The smell, the sicklyness of rotten flesh, hit me again. I thought of those “bully sticks” my childhood dog, Lucy, used to chew all day on the lawn. They were brown and made out of some animals' ground bones. I loved to watch her, the bones in her head bumping up and down as she moved her sharp teeth around the stick, holding the base of it between her little paws. She was happy for a brief moment, but she’d flown too close to the sun. When she returned inside, my Mom, who didn’t grow up with dogs, quickly attempted to mask the horrendous smell of her.  She’d say, “YUCK, yuck, yuck, yuck,” but Lucy didn’t care; she was happy with her stench.\n\n“She’s not a roast!” my dad would protest, as my mom sprinkled baby powder on her back like she was salting a meal. It didn’t help—she smelled like a clean slaughterhouse instead of just a regular one. Poor puppy.\n\n***\nI saw him pull into the parking lot. His car traversed the bumps of the old parking lot, trash strewn about. Last time he was here, we’d joked about how it wasn’t the safest-feeling place, but how bad could it be if it was behind a chocolate factory? \n\n“Hi Cecil!!!” I yelled across the parking lot. His name isn’t Cecil, but I like it, so I changed it. He’s a good sport, in many ways. \n\n“Hiii!” He waved back. He was still wearing his shorts from playing tennis with his brother, having had to rush over after I had changed the time on him at the last minute, as the later tour was booked up. It made my heart swell to think of packing up hurriedly, maybe even driving a little bit wrecklessly, to come make it one time.\n\n“Sorry, Officer, I’m late for a chocolate factory tour with my girlfriend.”\n\nWe walked in like we’d won the golden ticket. The smell of chocolate is warm and relaxing. There is something smooth about it.  \n\nCecil held the disks up to his nose, smelling the cinnamon-flavored one. “Ohhhh,” he said, his green eyes growing wider. I snatched it out of his hand like Violet Beurogaurd. I wondered which one of us would drown in the chocolate river.\n\n***\n\nThe tour guide was a Somerville version of Willy Wonka. He didn’t wear purple crushed velvet, but he did speak in some riddles and had an extreme passion for chocolate. “First, look at the chocolate, then smell it. Take your time and inhale.” We were sitting in a little classroom, where they host the beginning of the tours, holding paper cups with small squares of chocolate. I wanted to take a photo, but I couldn’t bear to pull my camera out, not during his enthusiastic presentation to all six of us. Instead, I inhaled with my nose all the way in the cup and was underwhelmed. I looked over at Cecil, who seemed to have the same reaction. This wasn’t adding up to what I wanted, not for my project at least. This was supposed to be a new experience, understanding the nuances behind each chocolate. \n\nThe tour guide moved us through the small factory, pointed out the heavy machinery that they had named (“Clifford the Big Red Mixer”), sitting us down on a few benches to tell us about cocoa beans and the evil Hershey workers who once came in for a tour. “They know what they do is bad… I just had the guts to say it,” he pronounced proudly. \n\nI desperately want to know about the badness behind a Reese’s Peanut Butter Cup.\n\n*** \n\nWhen we reached the end of the tour, we were allowed to try as many flavors of chocolate as we could point at. \n“There’s the flavor graveyard,” he said, pointing his gloved hand towards a wire storage rack littered with paper and small stuffed animals. \n\n“Why’d you get rid of the peanut butter one?” I asked, astounded I was seeing my beloved's name on an index card tombstone. \n\n“Too many people were allergic.” I rolled my eyes at Cecil, who shook his head in dismay. I was certainly going to be a victim of some chocolate disaster by the end of this tour. Maybe Cecil would shoot up into the sky in an elevator.\n\n*** \n\nWe tried around 15 types of chocolate. I tried to smell them all—each with the identical smell of paper cup and, in the background, a hint of chocolate. Each was supposedly distinct: cinnamon, corn flake, dark with almonds, orange, eggnog, almond… \n\n“If they get rid of that one, I walk,” the tour guide said as I slid a butterscotch piece into my mouth. \n\nI laughed at the thought of him quitting his job in this job market, just because they got rid of a specific flavor of chocolate. \n\nAfter around the tenth chocolate, my breathing became more shallow. The cCaffeine inthe the dark chocolate amounted to more than I had ever had. Plus, the handful of granulated sugar wasn’t slowing the racing of my heart.\n\n“So are you excited to be manager? When do you start? What are your responsibilities?” I asked him as he put the jars back onto the shelf. He looked taken aback at my interest in his career path. The others in the group leaned in to hear his answer. I followed up to ask him if you could make peppermint hot chocolate with the peppermint bark. \n\n“I tried, but you have to melt down around ten bars just to even start tasting the mint. If you make regular hot chocolate, then you put a peppermint stick in, it will be—”\n\n“—perfect!” I interjected. “A perfect day.”\n\nHe looked at me sideways. “I was going to say it will be more flavorful.” I think he was touched and slightly sad that my perfect day only requires a cup of peppermint hot chocolate.\n\n*** \n\nOn the way out, Cecil asked if that trip would fulfill my requirement for the project.\n\n“Definitely not.” \n\n“Why?!” he asked.\n\n“Because I didn’t smell anything different, and I didn’t take a single picture.” He took out his phone and took a picture of the wall of the factory. \n\n*** \n\nAfter the chocolate factory, we had to get to work on our own production —we were making two huge pies for Cecil's sister’s gathering the next day. On our dark walk to the Market Basket, still deeply affected by the quantity of cocoa and sugar, I ran in front of him. He wasn’t surprised, as I’ll often just take off running when he’s with me. He has no choice but to follow.\n\n“Wait, hold on,” he stopped running after me after passing a porch where some people were smoking cigarettes on their stoop. I turned around, annoyed we’d stopped. “I don’t think this looks good.” \n\n“Why? Because I’m beating you in a footrace?” \n\n“No, because I’m a man chasing a woman in the dark streets, telling her to ‘get back here.’” \n\nThe air had changed from morning autumn air to the nighttime variety. The leaves dried from the day, the trees breathing. \n\n*** \n\nWhen we returned to the apartment, Cecil and I were still feeling the effects of the copious amounts of chocolate. We thought fighting through the aisle of Market Basket might have burned some sugar and maybe lifting pounds of fruit up three flights of stairs would metabolize some of the caffeine. But there I was punching the air as he raised the chair over his head and into the kitchen. Soon, we were chopping apples and dancing to Bill Haley and His Comets—a dangerous but enjoyable combination while high on chocolate.\n\n***\n\nBy the end of the night, we lay unmoving on the couch. I felt close to needing medical attention. We would have headed to bed, yet two enormous pies, each the weight of my unborn niece, needed more time. Former New York Times chef turned YouTuber Allison Roman had tricked us. The line “Put the pie in the oven for 1 hour” sat just above the fold of the scroll. One more swipe would have revealed to us earlier that after that 1 hour, the pie needed another 45 minutes. \n\nAs it crept towards midnight, the scent of apples and peaches filled the apartment. ","body_h":"It had been a busy week of school and work. Mostly, I was tired because I had spent the previous night watching Florence Pugh play Kathy in East of Eden, haunted by imagery of a woman dying of botulism in her arms. Either way, I was looking forward to waking up late, shuffling out of bed at 10:30 as my younger peers preferred. Nowadays, though, I can never sleep that far into the day. Plus, the smell of marijuana smoke found its way through my open window and into my corner, third-floor bedroom and brought me back to junior year of college, when I lived above a pothead who made music deep into the night. Eventually I got used to the skunk smell, which filled my room, and created an air circulation system in which it was dampened by my pine-scented air freshener and also pushed away by my fan facing outwards. \u003cbr>\u003cbr>I rolled my eyes and noted the irony of starting my day of olfactory exploration with a smell I hate most deeply. My eyes barely opened; I flipped onto my stomach, and my nose was deep in the smell of m e was salting a meal. It didn’t help—she smelled like a clean slaughterhouse instead of just a regular one. Poor puppy.\u003cbr>\u003cbr>***\u003cbr>I saw him pull into the parking lot. His car traversed the bumps of the old parking lot, trash strewn about. Last time he was here, we’d joked about how it wasn’t the safest-feeling place, but how bad could it be if it was behind a chocolate factory? \u003cbr>\u003cbr>“Hi Cecil!!!” I yelled across the parking lot. His name isn’t Cecil, but I like it, so I changed it. He’s a good sport, in many ways. \u003cbr>\u003cbr>“Hiii!” He waved back. He was still wearing his shorts from playing tennis with his brother, having had to rush over after I had changed the time on him at the last minute, as the later tour was booked up. It made my heart swell to think of packing up hurriedly, maybe even driving a little bit wrecklessly, to come make it one time.\u003cbr>\u003cbr>“Sorry, Officer, I’m late for a chocolate factory tour with my girlfriend.”\u003cbr>\u003cbr>We walked in like we’d won the golden ticket. The smell of chocolate is warm and relaxing. There is something smooth about it.  \u003cbr>\u003cbr>Cecil held the disks up to his nose, smelling the cinnamon-flavored one. “Ohhhh,” he said, his green eyes growing wider. I snatched it out of his hand like Violet Beurogaurd. I wondered which one of us would drown in the chocolate river.\u003cbr>\u003cbr>***\u003cbr>\u003cbr>The tour guide was a Somerville version of Willy Wonka. He didn’t wear purple crushed velvet, but he did speak in some riddles and had an extreme passion for chocolate. “First, look at the chocolate, then smell it. Take your time and inhale.” We were sitting in a little classroom, where they host the beginning of the tours, holding paper cups with small squares of chocolate. I wanted to take a photo, but I couldn’t bear to pull my camera out, not during his enthusiastic presentation to all six of us. Instead, I inhaled with my nose all the way in the cup and was underwhelmed. I looked over at Cecil, who seemed to have the same reaction. This wasn’t adding up to what I wanted, not for my project at least. This was supposed to be a new experience, understanding the nuances behind each chocolate. \u003cbr>\u003cbr>The tour guide moved us through the small factory, pointed out the heavy machinery that they had named (“Clifford the Big Red Mixer”), sitting us down on a few benches to tell us about cocoa beans and the evil Hershey workers who once came in for a tour. “They know what they do is bad… I just had the guts to say it,” he pronounced proudly. \u003cbr>\u003cbr>I desperately want to know about the badness behind a Reese’s Peanut Butter Cup.\u003cbr>\u003cbr>*** \u003cbr>\u003cbr>When we reached the end of the tour, we were allowed to try as many flavors of chocolate as we could point at. \u003cbr>“There’s the flavor graveyard,” he said, pointing his gloved hand towards a wire storage rack littered with paper and small stuffed animals. \u003cbr>\u003cbr>“Why’d you get rid of the peanut butter one?” I asked, astounded I was seeing my beloved's name on an index card tombstone. \u003cbr>\u003cbr>“Too many people were allergic.” I rolled my eyes at Cecil, who shook his head in dismay. I was certainly going to be a victim of some chocolate disaster by the end of this tour. Maybe Cecil would shoot up into the sky in an elevator.\u003cbr>\u003cbr>*** \u003cbr>\u003cbr>We tried around 15 types of chocolate. I tried to smell them all—each with the identical smell of paper cup and, in the background, a hint of chocolate. Each was supposedly distinct: cinnamon, corn flake, dark with almonds, orange, eggnog, almond… \u003cbr>\u003cbr>“If they get rid of that one, I walk,” the tour guide said as I slid a butterscotch piece into my mouth. \u003cbr>\u003cbr>I laughed at the thought of him quitting his job in this job market, just because they got rid of a specific flavor of chocolate. \u003cbr>\u003cbr>After around the tenth chocolate, my breathing became more shallow. The cCaffeine inthe the dark chocolate amounted to more than I had ever had. Plus, the handful of granulated sugar wasn’t slowing the racing of my heart.\u003cbr>\u003cbr>“So are you excited to be manager? When do you start? What are your responsibilities?” I asked him as he put the jars back onto the shelf. He looked taken aback at my interest in his career path. The others in the group leaned in to hear his answer. I followed up to ask him if you could make peppermint hot chocolate with the peppermint bark. \u003cbr>\u003cbr>“I tried, but you have to melt down around ten bars just to even start tasting the mint. If you make regular hot chocolate, then you put a peppermint stick in, it will be—”\u003cbr>\u003cbr>“—perfect!” I interjected. “A perfect day.”\u003cbr>\u003cbr>He looked at me sideways. “I was going to say it will be more flavorful.” I think he was touched and slightly sad that my perfect day only requires a cup of peppermint hot chocolate.\u003cbr>\u003cbr>*** \u003cbr>\u003cbr>On the way out, Cecil asked if that trip would fulfill my requirement for the project.\u003cbr>\u003cbr>“Definitely not.” \u003cbr>\u003cbr>“Why?!” he asked.\u003cbr>\u003cbr>“Because I didn’t smell anything different, and I didn’t take a single picture.” He took out his phone and took a picture of the wall of the factory. \u003cbr>\u003cbr>*** \u003cbr>\u003cbr>After the chocolate factory, we had to get to work on our own production —we were making two huge pies for Cecil's sister’s gathering the next day. On our dark walk to the Market Basket, still deeply affected by the quantity of cocoa and sugar, I ran in front of him. He wasn’t surprised, as I’ll often just take off running when he’s with me. He has no choice but to follow.\u003cbr>\u003cbr>“Wait, hold on,” he stopped running after me after passing a porch where some people were smoking cigarettes on their stoop. I turned around, annoyed we’d stopped. “I don’t think this looks good.” \u003cbr>\u003cbr>“Why? Because I’m beating you in a footrace?” \u003cbr>\u003cbr>“No, because I’m a man chasing a woman in the dark streets, telling her to ‘get back here.’” \u003cbr>\u003cbr>The air had changed from morning autumn air to the nighttime variety. The leaves dried from the day, the trees breathing. \u003cbr>\u003cbr>*** \u003cbr>\u003cbr>When we returned to the apartment, Cecil and I were still feeling the effects of the copious amounts of chocolate. We thought fighting through the aisle of Market Basket might have burned some sugar and maybe lifting pounds of fruit up three flights of stairs would metabolize some of the caffeine. But there I was punching the air as he raised the chair over his head and into the kitchen. Soon, we were chopping apples and dancing to Bill Haley and His Comets—a dangerous but enjoyable combination while high on chocolate.\u003cbr>\u003cbr>***\u003cbr>\u003cbr>By the end of the night, we lay unmoving on the couch. I felt close to needing medical attention. We would have headed to bed, yet two enormous pies, each the weight of my unborn niece, needed more time. Former New York Times chef turned YouTuber Allison Roman had tricked us. The line “Put the pie in the oven for 1 hour” sat just above the fold of the scroll. One more swipe would have revealed to us earlier that after that 1 hour, the pie needed another 45 minutes. \u003cbr>\u003cbr>As it crept towards midnight, the scent of apples and peaches filled the apartment. "}],"exp":"My Shared Olfactory Experience: “Cecil and the Chocolate Factory”","expDesc":"Toured the Taza Chocolate factory in Somerville","mode":"Written Reflection","mode_h":"Written Reflection","exp_h":"\u003cb>My Shared Olfactory Experience:\u003c/b> “Cecil and the Chocolate Factory”","expDesc_h":"\u003ci>Toured the Taza Chocolate factory in Somerville\u003c/i>"},{"id":"sight","title":"Sight / Sound","kicker":"VISUAL / AUDITORY","suggest":["audio","photos","text"],"blocks":[{"id":"9hmvgug4","type":"text","items":[],"files":[],"images":[],"heading":"Narrative","body":"I accidentally added the wrong Paytan in the group chat. I was sure she spelled her name with an “e,” but that was someone else—either the girl from middle school who loved “The Hunger Games” so much that she slept in a tree, or that guy I met in Dick’s Sporting Goods who helped me call my phone when I lost it. It was no matter: When I eventually got in touch with the intended Paytan, she couldn’t come to the proposed outing to the planetarium to see a light show.\n\nThankfully, Antonia said yes. Thankfully, she selected Coldplay and not Pink Floyd variety: “Laser Floyd: The Wall.” Alisa said that one made her feel sick, and that the only reason people enjoyed it was that they were on hard drugs. I believed her—In college, my friend “Lucky Sam” asked me to go to a Pink Floyd tribute concert and proposed we do mushrooms beforehand. I accepted the former and politely declined the latter. (Although, when I was sitting through the third hour of the show, I wished I’d done some psychedelic experimenting.)\n\nI met Antonia at the library on a Friday. On the way in, a woman from my Monday class heckled me. “You just can’t stay away.” It was true; I had been spending way too much time at the Library. On Sunday, it’s my place of worship.\n\nAntonia was slightly late and already pissed off. Like my friend Frances, she’s always got a story brewing, and I always want to hear it.\n\n“What’s wrong?” I asked her, smiling in anticipation of her complaint. She had seen another person's dorm room, which was four times the size of hers. \n\n\n“I’m just angry because I live in a shoebox and Tim lives in a damn mansion,” she said as I opened the door for her.\n\nOn the Subway, I took pictures of the lights—the glowing orange hues reflecting off the rainy city and flickering white fluorescents beating down onto our heads. I’ve never liked an overhead light, which is certainly due to the old farmhouse I grew up in and my Mom’s preferences. When Cecil turns on the overhead by habit, I screech upwards at the ceiling like a vampire. Antonia held me up while I pressed my phone against the T’s door window.\n\n“What’s your favorite Coldplay song?” I asked, examining the blurry photos. I wondered if the power of “Viva La Vida” could change her feelings about her room size. She listed off a few, but it was clear that The Scientist was her favorite. I was more of a “Green Eyes” fan.\n\n\nThe variety of music and people’s taste in it is one of my favorite things to think about. It seems like a hint into what’s going on in the brain. Someone I met this weekend said he had a middle school field trip where one of the boys had to listen to heavy metal to go to sleep. My friend Jackie listens to the same songs five hundred times in a row. What does a love for Ella Fitzgerald’s Jazz, Max Ricther’s movie scores, and the occasional techno beats mean about my psyche?\n\nWe arrived at our stop, and I informed Antonia that we had another 15 minutes to walk. “Come on, kid!” I said as we stepped over a pile of permanently flattened trash.\n\n10 minutes later, we found ourselves walking down the highway in the rain.\n\n“I’ve never been to the area!” Antonia said over the cars' tires hitting the puddles, looking upwards at industrial structures.\n\n“Isn’t it beautiful?” I asked. A man biking on the sidewalk grazed my elbow. Antonia cursed his behavior, but I knew, in the same situation, I'd be biking on a dark sidewalk too.\n\nWe arrived at the Science Museum. The dinging of the large contraption in the lobby of the museum and the colored lines on the floor, mirrored in the ceiling by cables of neon lights, sent a tingling sensation between my eyes. I remember being on my dad’s shoulders in this hallway, studying the movement of the objects with my auntie Penn, giving all my stuff to my Mom for her to hold in her purse.\n\nWe found Remi at the front of the line for the Planetarium. Cutting the line is a move I would normally be trepidatious to make amongst Bostonians. Luckily, the seven to twelve other people behind her were mild-mannered. It only made sense if you think about the sample of people who had come to listen to Coldplay show at the planetarium on a Friday night.\n\nWe entered the auditorium: a circular arrangement of chairs, all leaning as far back as possible, tilting their viewers' eyes up to the domed screen above. Remi questioned the fire evacuation and safety of the space. “Fire in the Planetarium,” I decided, would be the name of a Coldplay album. It would also be quite a turn of events for my project.\n\nEventually, the woman came on the loudspeaker to announce they would be turning off the Exit signs (another huge safety red flag) and that Coldplay was her first concert. I calculated how old that would make her as the lights dimmed.\n\nFor the first few minutes, there were no stars or Chris Martin. We were just zooming through a cityscape and feeling the vibrations of electronic strings. My eyes started to cross, and my breath became slightly shallower.\n\n“This is making me sick as hell,” I whispered to Remi.\n\n“Dude, if you vomit on me…”\n\nI put my hand over my eyes and cursed the motivated forgetfulness I had with my motion sickness. I remember as I tried to breathe slower, I threw up in my grandparents’ bathroom sink after I saw Pixar’s Wall-E. Grandma asked me to aim for the toilet next time and, in the adjacent room, Grandpa told my brother that I was “getting rid of my lunch.” I had to lie on the pavement at Storyland after the room spun around me in Merlin’s room. I even had to put my forehead down on my desk in high school physics class during the video Mr. Edgar played about strobe lights and standing waves.\n\nEventually, I looked up to see the graphics change to stars and could get my bearings by looking at the edge of the screen, pleading with my eyes and inner ears to not believe what they were sensing.\n\nBut that didn’t last long. When an image of one of those huge white telescopes spun increasingly faster, I looked around for the exits that the woman had warned would turn off. An exit sign not glowing is an unbelievable waste of materials. My hands were dripping sweat as I sank deeper into my seat. By the time “Sky Full of Stars” played (a layup for this show, and certainly the inspiration), I was on borrowed time.\n\nLuckily, the woman's soft voice came on the speaker system soon after, and the lights rose. I was able to stumble out through the tight rows to the hallway, where I revealed my sweat-drenched sweatshirt to my friends.\n\nAntonia said she shed a few tears during “The Scientist.” Meanwhile, Remi was about to fall asleep.\n\n“So, was this a good 'visual and auditory' experience?” one of them asked. I couldn’t tell whose voice it was. Sounds were going in and out.  I also wasn’t able to focus my vision on anyone's face.\n\n“For sure,” I said, taking a seat. After a few minutes, my heart rate was down, and my eyes could see more clearly. They could tell from my sweat drenched sweatshirt that I had lied. \n\n\nThen, I saw a mouse running on the red line of the carpet, 20 feet away. I pointed at it, and Remi declared we were leaving.\n\nAfter twenty or so minutes, we were picked up by an Uber, and I tried to breathe more deeply and keep my eyes on my glistening palms. I reflected, once again, on the variety of experiences and the power of music. Antonia was emotional, Remi got sleepy, and I felt my saliva become thinner. I wondered how Paytan or Peyton would have felt.\n\nThe next day, on my run, I felt the power once again when I heard that twelve-note riff at the beginning of “Clocks” and had to stop to dry heave.","fold":"Dropdown (opens on click)","body_h":"I accidentally added the wrong Paytan in the group chat. I was sure she spelled her name with an “e,” but that was someone else—either the girl from middle school who loved “The Hunger Games” so much that she slept in a tree, o t they were sensing.\u003cbr>\u003cbr>But that didn’t last long. When an image of one of those huge white telescopes spun increasingly faster, I looked around for the exits that the woman had warned would turn off. An exit sign not glowing is an unbelievable waste of materials. My hands were dripping sweat as I sank deeper into my seat. By the time “Sky Full of Stars” played (a layup for this show, and certainly the inspiration), I was on borrowed time.\u003cbr>\u003cbr>Luckily, the woman's soft voice came on the speaker system soon after, and the lights rose. I was able to stumble out through the tight rows to the hallway, where I revealed my sweat-drenched sweatshirt to my friends.\u003cbr>\u003cbr>Antonia said she shed a few tears during “The Scientist.” Meanwhile, Remi was about to fall asleep.\u003cbr>\u003cbr>“So, was this a good 'visual and auditory' experience?” one of them asked. I couldn’t tell whose voice it was. Sounds were going in and out.  I also wasn’t able to focus my vision on anyone's face.\u003cbr>\u003cbr>“For sure,” I said, taking a seat. After a few minutes, my heart rate was down, and my eyes could see more clearly. They could tell from my sweat drenched sweatshirt that I had lied. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Then, I saw a mouse running on the red line of the carpet, 20 feet away. I pointed at it, and Remi declared we were leaving.\u003cbr>\u003cbr>After twenty or so minutes, we were picked up by an Uber, and I tried to breathe more deeply and keep my eyes on my glistening palms. I reflected, once again, on the variety of experiences and the power of music. Antonia was emotional, Remi got sleepy, and I felt my saliva become thinner. I wondered how Paytan or Peyton would have felt.\u003cbr>\u003cbr>The next day, on my run, I felt the power once again when I heard that twelve-note riff at the beginning of “Clocks” and had to stop to dry heave.\u003c/div>"},{"id":"tksiouwh","type":"video","items":[],"files":[],"images":[], 2ca1.jpg","caption":""},{"id":"e9c9b2b672f844fb1763a9f28c2435a5","url":"media/e9c9b2b672f844fb1763a9f28c2435a5.jpg","caption":""},{"id":"f1a6a5df3e0686b1dbf2f96e35d59763","url":"media/f1a6a5df3e0686b1dbf2f96e35d59763.jpg","caption":""},{"id":"c7450b23f629502ffd0d63a711f367a6","url":"media/c7450b23f629502ffd0d63a711f367a6.jpg","caption":""},{"id":"956aa72bbfa71f852f0bda7bf5768e5f","url":"media/956aa72bbfa71f852f0bda7bf5768e5f.jpg","caption":""}],"files":[],"images":[],"title":"Photos"}],"exp":"My Shared Auditory / Visual Experience: “Sky Full of Vomit”","expDesc":"Watched a Coldplay light show at the Planetariaum","mode":"Written Reflection, Photos, and Videos","mode_h":"Written Reflection, Photos, and Videos","exp_h":"\u003cb>My Shared Auditory / Visual Experience:\u003c/b> “Sky Full of Vomit”","expDesc_h":"\u003ci>Watched a Coldplay light show at the Planetariaum\u003c/i>"},{"id":"reflection","title":"Reflection","kicker":"","reflect":true,"suggest":["text","quote","photos"],"blocks":[{"id":"yuy80j5n","type":"text","items":[],"files":[],"images":[],"heading":"","body":"During my childhood, my brothers spent most of our time in the woods, climbing trees and, unfortunately, chopping hundreds of worms into pieces (we incorrectly learned that they grow back). I attribute some of the magical happiness of my childhood to a variety of sensory experiences I had each day: the smells of the dirt and the pine needles, the feeling of the damp leaves and thorn bushes and sap, the taste of lemongrass, the sound of the deer nearby, and the sight of light filtering through leaf canopies.\n\nIn the woods, I got to know the limits of my body. How far up the tree I felt comfortable climbing, if I could outrun my brothers or move that rock, if that birch tree bark was okay to eat.\n\nIn adulthood, most of knowing myself consists of learning the limits of my cognition. It brings me an equal measure but different quality of joy to write, calculate, and search in order to solve problems or create something new.\n\nBut each day, I still touch back with something for my body, and I recognize it remains a key source of gladness and grounding.\n\nIt’s rare as an adult, though, that I will experience the amount of newness in the sensations my body feels, as it did in the woods. My bodily senses are mostly the same: running or stretching or lying.\n\nThis project helped me branch out again, and to sense new motion, lights, tastes, smells. The importance of it was apparent in the experiences I shared with people I was with. Each was energized, no matter how tame or intense the experience was, by newness. I loved seeing my boyfriend’s eyes light up because of cinnamon chocolate, or my tense classmates lay down on the floor and take a deep breath. It was refreshing to feel accomplishment or unease, not through a cognitive problem, but through tasting a new food or watching a spinning light show.\n"}]}],"shareTitle":"Sharing an Embodied experience","shareImg":null,"shareCap":"","fold":true,"lede_h":""},"social":{"title":"Social","summary":"Music, food, and a Reuben sandwich with the mailman.","lede":"My Shared Social Experience: “The Gala of Strangers” \nHosted a dinner party with people I know and people I didn’t know\n\n\nMode of Documentation: Audio recordings and corresponding photos","cover":null,"sections":[{"id":"so-prep","title":"Preparation","kicker":"","suggest":["text","photos","video"],"blocks":[{"id":"3hwo6cmo","type":"text","items":[],"files":[],"images":[],"heading":"","body":"","body_h":""},{"id":"w1dfzlrn","type":"photos","items":[{"id":"6c07341091276dfcae955289c4b99662","url":"media/6c07341091276dfcae955289c4b99662.png","caption":""}],"files":[],"images":[],"title":"Invitation","link":""},{"id":"s6hz914f","type":"spotify","items":[],"files":[],"images":[],"link":"https://open.spotify.com/playlist/33IPgc4V8AsDrykcncOhbm?si=NaIW1vGDSB-BpjI_cXXEbw","title":"Strangers Dinner Party","artist":"Tomer, Mina, Matt, Mim, Alisa, Karen, Willa, and Jenn
