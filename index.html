that this is the challenge and joy of design, and happily, the motivation of the project. The need to work with community, educators, and learners to create. And for this, I need more partners in education, in both theory and practice, to share this with.  \u003cbr>\u003cbr>I’ve done my best to create a small outline, a nascent idea, for a lesson structure inspired The Sharing Project portfolio. I am sharing it with others in hopes that others might also be able to reflect on what sharing means in these five domains, to have such a rich and delightful experience as I did, and maybe how to reach those who are most affected by a lack of sharing. I hope they think of people like my Grandpa and niece, who can share across time and space in a more connected world. I hope we can work together.\u003cbr>\u003cbr>**Matt is very good at his job. He won the Edie for it. It’s like the Oscars of educators. I was at the ceremony, and I wore an outfit that looked like I was a little boy on the Titanic.\u003cbr>\u003c/div>"},{"id":"iu51cyx0","type":"photos","items":[{"id":"0be39aadeb571c301e7a170bdc1c86ae","url":"media/0be39aadeb571c301e7a170bdc1c86ae.png","caption":""}],"files":[],"images":[],"title":"Learner Introduction","link":"https://docs.google.com/document/d/1znxia6BxANU9tsuozU0rckIT1mTKC_-uNL33Rhoaqcg/edit?usp=sharing","file":{"id":"b89339df89a637623c6051a9e1952a5f","url":"media/b89339df89a637623c6051a9e1952a5f.pdf","name":"Learner_Introduction.pdf"}},{"id":"cgjyvcn5","type":"photos","items":[{"id":"fb9ce1a18afce2fc6511ce88d5103207","url":"media/fb9ce1a18afce2fc6511ce88d5103207.png","caption":""},{"id":"17ed8769f08ba516e4a847e7d097aa19","url":"media/17ed8769f08ba516e4a847e7d097aa19.png","caption":""},{"id":"9c3c861028aec782ebcc1c7a7c52ff08","url":"media/9c3c861028aec782ebcc1c7a7c52ff08.png","caption":""},{"id":"0cd1f5a5e47bd80ed66b12a53dbdad9f","url":"media/0cd1f5a5e47bd80ed66b12a53dbdad9f.png","caption":""}],"files":[],"images":[],"title":"Educator and Admin Packet","link":"https://docs.google.com/document/d/1M6lyl9o_yftuYLmhwCd0lYEnu9iOOLE4GTvT659555g/edit?usp=sharing","file":{"id":"7d9d78f018116a02c697d89258bfaf78","url":"media/7d9d78f018116a02c697d89258bfaf78.pdf","name":"Educator_Packet.pdf"}},{"id":"ze70fsrt","type":"download","items":[],"files":[],"images":[],"link":"https://docs.google.com/presentation/d/1uo-JzCyM8hWTFaasZXACsYWI9jTtnZVxN0muEudDMhw/edit?usp=sharing","title":"Learner Slides","desc":"","file":{"id":"7f3b89d278901aae722d3eae21ea14d8","url":"media/7f3b89d278901aae722d3eae21ea14d8.pdf","name":"The Sharing Project_Slide Deck.pdf"},"inside":"cgjyvcn5"}]},{"id":"cu-main","title":"","kicker":"","grid":true,"suggest":["lesson"],"blocks":[]},{"id":"reflection","title":"Reflection","kicker":"","reflect":true,"suggest":["text","quote","photos"],"blocks":[]}]},"credits":{"title":"Thank You","lede":"To the people who made this project happen.","cover":null,"sections":[{"id":"cr-main","title":"","kicker":"","addLabel":"Add to this page","suggest":["credits","text"],"blocks":[{"id":"names-1","type":"credits","title":"","items":[{"id":"z26yspyy","name":"Edward Donnelly","role":"Inspiration, gratitude, love, boat rides","top":true},{"id":"nko92411","name":"Sloane Long","role":"Inspiration, being the best girl, sleeping in increasingly longer increments, cuteness","top":true},{"id":"i91qwecz","name":"Alisa “Lizzie”","role":"Friendship, “setting me up perfect”, chairs"},{"id":"fc2df28n","name":"One-Pot Frances","role":"Stories, creativity,  The Pot"},{"id":"ng7w0sh7","name":"Lindsay","role":"Kindness"},{"id":"343b6meu","name":"Moe","role":"Helpfulness"},{"id":"aeht1rkw","name":"KB","role":"Course design, impeccable reading selections, organized emails,"},{"id":"k5dsqtlc","name":"Nina","role":"Guidance, Collage materials"},{"id":"664mdcd5","name":"McKenna & Co.","role":"Reflection, a place to lie down on a Wednesday"},{"id":"o5hpsixc","name":"Jenn","role":"Encouragement, levity"},{"id":"3htx63kj","name":"Andrew “Cecil”","role":"Love, support, snacks, poems"},{"id":"gxprozvs","name":"Antonia","role":"Commentary, anecdotes"},{"id":"h244bo39","name":"Remi","role":"Willingness, insight on fire safety"},{"id":"72ezbvdv","name":"Paytan (the one I meant to text)","role":"Receiving extra texts"},{"id":"r6og5n84","name":"Peytan (the ones in my past (and future))","role":"Being in a mysterious group chat"},{"id":"ulsqs1zb","name":"Willa","role":"Thoughtfulness, answering all of my stupid questions, an ice tray"},{"id":"q07mfftz","name":"Greer","role":"Friendship with Willa"},{"id":"854v76qn","name":"Karen","role":"Coolness, chairs"},{"id":"fji25xm2","name":"Tomer","role":"Picture-taking skills, introspection"},{"id":"63fs0wx5","name":"Mina","role":"Kindness about Matt’s drawing, future lawyerhood"},{"id":"1htwdibf","name":"Matt","role":"Sharing the womb, humor, being better than me"},{"id":"gbk8pevz","name":"Devin","role":"Fortitude, being a great dad to Sloane"},{"id":"tpo6aspx","name":"Ashley","role":"Strength, being a great mom to Sloane"},{"id":"hpbgxdmc","name":"Dad / Yell","role":"Dependability, calmness, rides, and peanuts"},{"id":"kgns94aj","name":"Mim","role":"Enthusiasm, brightness"},{"id":"7hth7b8c","name":"Sweatshirt","role":"Plowing Fresh Pond"},{"id":"uc0dh7h6","name":"Ranger","role":"Concern for citizens"},{"id":"5fbxb7wl","name":"Texan","role":"Great questions, confusing conversation"},{"id":"j1auguwj","name":"Patrice “Treecie”","role":"Confidence"},{"id":"npw2lcx9","name":"Maureen “Reenie”","role":"Mentorship"},{"id":"9ptpuxr7","name":"Mom / Robert B. Burns","role":"Feeding me, everything"},{"id":"2mwx0lyl","name":"Auntie Penn","role":"Listening, taking children seriously"},{"id":"ohp8l0es","name":"Maddie “Muffins”","role":"Earnestness"},{"id":"k5q6nhyh","name":"Aleigha “Elijah”","role":"Vibes, you know what else"},{"id":"kymvseaf","name":"Vicky “Jackie”","role":"Elaboration, enthusiasm"},{"id":"nhgft4z9","name":"Anthony","role":"Imagination, eldest cousinship"},{"id":"z6jgjigi","name":"Kelsey","role":"Editing skills"},{"id":"f75ae4ba","name":"Ingsa","role":"Critique, An amazing scarf"},{"id":"01iujc75","name":"Sanskriti","role":"Critique, accountability (on my desk)"},{"id":"89z65ts6","name":"Sasha","role":"Critique, Letting me pet Blake in the park"},{"id":"vxakyv4m","name":"Lia \"Leon\"","role":"Boldness, Prepping me for spice"}]}],"wide":true}],"lede_h":"To the people who made this project happen."}},"site":{"eyebrow":"A portfolio","domainsHeading":"Five ways to share...","epiLabel":"From the introduction","footer":"The Sharing Project · Learning Design, Innovation, and Technology"},"mig":4}</script>
<script id="sp-main">
(function () {
  "use strict";
  const PAGES = [
    { key: "home", nav: "Home" },
    { key: "inspiration", nav: "Inspiration" },
    { key: "creative", nav: "Creative", n: 1 },
    { key: "embodied", nav: "Embodied", n: 2 },
    { key: "social", nav: "Social", n: 3 },
    { key: "interdependent", nav: "Interdependent", n: 4 },
    { key: "emotional", nav: "Emotional", n: 5 },
    { key: "sharing", nav: "Sharing the Sharing Project" },
    { key: "credits", nav: "Sharing" }
  ];
  const DOMAINS = PAGES.filter(p => p.n);
  const TYPES = {
    text: "Text", quote: "Quote", photos: "Photos", story: "Photo + story",
    video: "Video", audio: "Audio", spotify: "Spotify song", download: "Download", lesson: "Lesson",
    duo: "Video + photos", lyrics: "Song", timeline: "Timeline", credits: "Names"
  };
  const IMG_OK = ["image/png", "image/jpeg", "image/gif", "image/webp"];
  const MAX = 20 * 1024 * 1024;

  const saved = JSON.parse(document.getElementById("sp-data").textContent);
  let state = clone(saved);
  let route = "home", editing = false, dirty = false, menuOpen = false, pendingDraft = null, insertAfter = null;
  let ns = { artifact: null, assets: null, downloads: null };
  const app = document.getElementById("app");

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function paras(t) { return String(t || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>").join(""); }
  function ss(k, v) { try { if (v === undefined) return JSON.parse(sessionStorage.getItem(k) || "null"); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  const SITE_DEFAULTS = { eyebrow: "A portfolio", domainsHeading: "Five ways Grandpa shared", epiLabel: "From the introduction", footer: "The Sharing Project · Learning Design, Innovation, and Technology" };
  function norm(s) {
    s.site = Object.assign({}, SITE_DEFAULTS, s.site || {});
    /* one-time layout changes: five Creative parts, four Embodied dropdowns, a song on Emotional */
    if ((s.mig || 0) < 1) {
      const cr = s.pages.creative;
      if (cr && !cr.sections.some(x => x.duo)) {
        cr.sections = cr.sections.filter(x => x.blocks.length || x.title).concat([1, 2, 3, 4, 5].map(n => ({
          id: "cr-" + n, title: "", kicker: "", wide: true, duo: true, suggest: ["duo", "text"],
          blocks: [{ id: "crd-" + n, type: "duo", images: [], file: null, link: "", caption: "" }] })));
      }
      const em = s.pages.embodied;
      if (em) {
        em.fold = true; delete em.senseNav;
        const snd = em.sections.find(x => x.id === "sound");
        if (snd && !snd.blocks.length && em.sections.some(x => x.id === "sight")) em.sections = em.sections.filter(x => x !== snd);
      }
      const mo = s.pages.emotional, m = mo && mo.sections.find(x => !x.reflect);
      if (m && !m.blocks.some(b => b.type === "lyrics")) {
        m.blocks.unshift({ id: "song-1", type: "lyrics", title: "", artist: "", lyrics: "", note: "", file: null });
        m.suggest = ["lyrics", "spotify", "audio", "text"];
      }
      s.mig = 1;
    }
    if ((s.mig || 0) < 2) {
      const so = s.pages.social;
      if (so) {
        so.tabs = true;
        const m = so.sections.find(x => x.id === "so-main");
        if (m && !m.title) m.title = "Audio/Visual Documentation";
        if (!so.sections.some(x => x.id === "so-prep")) so.sections.unshift({ id: "so-prep", title: "Preparation", kicker: "", suggest: ["text", "photos", "video"], blocks: [] });
      }
      s.mig = 2;
    }
    if ((s.mig || 0) < 3) {
      const mo = s.pages.emotional;
      if (mo) {
        const songs = mo.sections.find(x => x.blocks.some(b => b.type === "lyrics")) || mo.sections.find(x => !x.reflect);
        if (songs) songs.carousel = true;
        if (!mo.sections.some(x => x.id === "em-intro")) mo.sections.unshift({ id: "em-intro", title: "", kicker: "", addLabel: "Add above the songs", suggest: ["photos", "download", "text", "story"], blocks: [] });
      }
      s.mig = 3;
    }
    if ((s.mig || 0) < 4) {
      const mo = s.pages.emotional;
      if (mo) mo.sections.forEach(x => { if (x.carousel) x.wide = true; });
      s.mig = 4;
    }
    if (!s.pages.credits) s.pages.credits = { title: "Sharing", lede: "", cover: null, sections: [{ id: "cr-main", title: "", kicker: "", addLabel: "Add to this page", suggest: ["credits", "text"], blocks: [{ id: "names-1", type: "credits", title: "", items: [] }] }] };
    DOMAINS.map(d => ({ key: d.key })).concat([{ key: "sharing" }]).forEach(d => {
      const p = s.pages[d.key];
      if (p && !p.sections.some(x => x.reflect)) p.sections.push({ id: "reflection", title: "Reflection", kicker: "", reflect: true, suggest: ["text", "quote", "photos"], blocks: [] });
    });
    return s;
  }
  norm(state);

  /* Editable text: plain output for visitors, click-to-type in edit mode. */
  function P(pk, sid, bid, field) { return [pk, sid || "", bid || "", field].join("|"); }
  function ed(path, val, tag, cls, opts) {
    opts = opts || {};
    if (!editing) return val ? "<" + tag + (cls ? ' class="' + cls + '"' : "") + ">" + (opts.multi ? paras(val) : esc(val)) + "</" + tag + ">" : "";
    return "<" + tag + ' class="' + (cls || "") + (opts.multi ? " pre" : "") + '" contenteditable="plaintext-only" spellcheck="true" data-ed="' + esc(path) + '"' +
      (opts.multi ? "" : ' data-single="1"') + ' data-ph="' + esc(opts.ph || "Type here") + '">' + esc(val || "") + "</" + tag + ">";
  }
  function setField(path, value) {
    const p = path.split("|"), pk = p[0], sid = p[1], bid = p[2], f = p[3];
    let o;
    if (pk === "site") o = state.site;
    else if (!sid) o = state.pages[pk];
    else if (!bid) o = findSec(pk, sid);
    else o = findBlk(pk, sid, bid);
    const ks = f.split(".");
    for (let i = 0; o && i < ks.length - 1; i++) o = o[ks[i]];
    if (o) o[ks[ks.length - 1]] = value;
  }

  /* Formatted text keeps only bold, italic, underline, colour, font and size. */
  const SW = [{ n: "Ink", v: "var(--ink)" }, { n: "Gray", v: "var(--muted)" }, { n: "Gold", v: "var(--gold)" }, { n: "Lake blue", v: "var(--lake)" },
    { n: "Green", v: "var(--c-creative)" }, { n: "Blue", v: "var(--c-embodied)" }, { n: "Orange", v: "var(--c-social)" }, { n: "Purple", v: "var(--c-interdependent)" }, { n: "Red", v: "var(--c-emotional)" }];
  const KEEP_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, DIV: 1, P: 1, SPAN: 1, FONT: 1 };
  const KEEP_CSS = ["color", "font-family", "font-size", "font-weight", "font-style", "text-decoration", "text-decoration-line"];
  function clean(html) {
    const doc = new DOMParser().parseFromString("<div>" + String(html || "") + "</div>", "text/html");
    const root = doc.body.firstChild;
    (function walk(n) {
      Array.from(n.childNodes).forEach(c => {
        if (c.nodeType === 3) return;
        if (c.nodeType !== 1) { c.remove(); return; }
        if (!KEEP_TAGS[c.tagName]) {
          if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|SVG|MATH)$/.test(c.tagName)) { c.remove(); return; }
          walk(c); c.replaceWith(...Array.from(c.childNodes)); return;
        }
        const keep = {};
        KEEP_CSS.forEach(k => { const v = c.style.getPropertyValue(k); if (v && !/url\(|expression|javascript/i.test(v)) keep[k] = v; });
        const fc = c.getAttribute("color"), ff = c.getAttribute("face"), fz = c.getAttribute("size");
        Array.from(c.attributes).forEach(a => c.removeAttribute(a.name));
        Object.keys(keep).forEach(k => c.style.setProperty(k, keep[k]));
        if (c.tagName === "FONT") {
          if (fc && /^#?[\w(),.\s%-]+$/.test(fc)) c.setAttribute("color", fc);
          if (ff && /^[\w\s,"'-]+$/.test(ff)) c.setAttribute("face", ff);
          if (fz && /^[1-7]$/.test(fz)) c.setAttribute("size", fz);
        }
        walk(c);
      });
    })(root);
    return root.innerHTML;
  }
  function richOf(val, html, multi) { return html ? clean(html) : (multi && !editing ? paras(val) : esc(val || "").replace(/\n/g, "<br>")); }
  function edr(path, val, html, tag, cls, opts) {
    opts = opts || {};
    if (!editing) return val || html ? "<" + tag + ' class="rich ' + (cls || "") + '">' + richOf(val, html, opts.multi) + "</" + tag + ">" : "";
    return "<" + tag + ' class="rich ' + (cls || "") + '" contenteditable="true" spellcheck="true" data-ed="' + esc(path) + '" data-rich="1"' +
      (opts.multi ? "" : ' data-single="1"') + ' data-ph="' + esc(opts.ph || "Type here") + '">' + richOf(val, html, opts.multi) + "</" + tag + ">";
  }

  /* ---------- rendering ---------- */
  function navHtml() {
    return PAGES.map((p, i) => (i === 2 || i === 7 ? '<span class="sep" aria-hidden="true"></span>' : "") +
      '<a href="#' + p.key + '"' + (route === p.key ? ' aria-current="page"' : "") + ">" + esc(p.key === "home" ? "Home" : state.pages[p.key].title || p.nav) + "</a>").join("");
  }

  function printHtml(img, attrs, tilt) {
    if (!img || !img.url) return "";
    return '<button type="button" class="print ' + (tilt || "") + '" ' + attrs + ' aria-label="Open photo' + (img.caption ? ": " + esc(img.caption) : "") + '">' +
      '<img src="' + esc(img.url) + '" alt="' + esc(img.caption || "") + '" loading="lazy">' +
      '<span class="cap">' + esc(img.caption || "") + "</span></button>";
  }

  function blockHtml(pk, sec, b, idx, storyIdx) {
    const ref = 'data-p="' + pk + '" data-s="' + sec.id + '" data-b="' + b.id + '"';
    let h = "";
    const E = (f, tag, cls, opts) => ed(P(pk, sec.id, b.id, f), b[f], tag, cls, opts);
    const R = (f, tag, cls, opts) => edr(P(pk, sec.id, b.id, f), b[f], b[f + "_h"], tag, cls, opts);
    switch (b.type) {
      case "text":
        if (!editing && !b.heading && !b.body) break;
        if (b.heading && ((pk === "sharing" && !sec.reflect) || b.fold === "Dropdown (opens on click)")) {
          /* on Sharing the Sharing Project, text with a heading is a dropdown named by that heading */
          const key = pk + "/" + b.id;
          h = '<details class="fold pfold" data-fold="' + esc(key) + '"' + (openFolds.has(key) ? " open" : "") + '><summary><span class="fold-h">' + (b.heading_h ? clean(b.heading_h) : esc(b.heading)) + '</span></summary><div class="fold-body b-text">' +
            (editing ? '<div class="fold-edit">' + R("heading", "h3", "fold-title", { ph: "Heading (shown on the dropdown)" }) + "</div>" : "") + R("body", "div", "", { multi: 1, ph: "Write here…" }) + "</div></details>";
          break;
        }
        h = '<div class="b-text' + (b.essay ? " essay" : "") + '">' + R("heading", "h3", "", { ph: "Heading (optional)" }) + R("body", "div", "", { multi: 1, ph: "Write here…" }) + "</div>";
        break;
      case "quote":
        h = '<figure class="b-quote">' + E("text", "blockquote", "", { multi: 1, ph: "Quote" }) + E("by", "figcaption", "", { ph: "Who said it (optional)" }) + "</figure>";
        break;
      case "photos": {
        const items = (b.items || []).filter(i => i.url), link = safeUrl(b.link), pdf = b.file && b.file.url;
        /* an optional PDF and Google Drive link sit under the photos */
        const att = pdf || link ? '<div class="p-att">' +
          (pdf ? '<a class="btn" href="' + esc(b.file.url) + '" target="_blank" rel="noopener" data-act="dl" data-url="' + esc(b.file.url) + '" data-name="' + esc(b.file.name || "file") + '">Download ' + esc((extOf(b.file.name) || "file").toUpperCase()) + "</a>" : "") +
          (link ? '<a class="btn ghost" href="' + esc(link) + '" target="_blank" rel="noopener">' + (/(drive|docs)\.google\./i.test(link) ? "Open in Google Drive" : "Open link") + " ↗</a>" : "") + "</div>" : "";
        if (!items.length && !att) { h = editing ? '<button type="button" class="drop slim" data-act="blk-edit" ' + ref + ">+ Add photos</button>" : ""; break; }
        const cls = items.length === 1 ? " one" : items.length === 2 ? " two" : "";
        /* Inspiration packs photos into rows at their own shapes; elsewhere they sit as tilted prints */
        const grid = !items.length ? "" : (pk === "creative" || pk === "social")
          ? '<div class="b-photos centered' + (items.length === 1 ? " one" : "") + '">' + items.map((it, i) => printHtml(it, 'data-act="lb" ' + ref + ' data-i="' + i + '"', "")).join("") + "</div>"
          : pk === "inspiration"
          ? '<div class="jgrid' + (items.length === 1 ? " one" : "") + '">' + items.map((it, i) => printHtml(it, 'data-act="lb" ' + ref + ' data-i="' + i + '"', "")).join("") + "</div>"
          : '<div class="b-photos' + cls + '">' + items.map((it, i) => printHtml(it, 'data-act="lb" ' + ref + ' data-i="' + i + '"', i % 3 === 0 ? "tilt-a" : i % 3 === 2 ? "tilt-b" : "")).join("") + "</div>";
        if (pk === "sharing" && (b.title || editing)) {
          /* on Sharing the Sharing Project, each titled photo section is a dropdown */
          const key = pk + "/" + b.id;
          h = '<details class="fold pfold" data-fold="' + esc(key) + '"' + (openFolds.has(key) ? " open" : "") + '><summary><span class="fold-h">' + esc(b.title || "Untitled photos (choose Edit photos to name it)") + '</span></summary><div class="fold-body">' + grid + att +
            ((foldKids[b.id] || []).length ? '<div class="fold-kids">' + foldKids[b.id].map(k => blockHtml(pk, sec, k, 0, 0)).join("") + "</div>" : "") + "</div></details>";
        } else h = E("title", "h3", "media-title", { ph: "Title above the photos (optional)" }) + grid + att;
        break;
      }
      case "story":
        h = '<div class="b-story' + (storyIdx % 2 ? " flip" : "") + '"><div class="s-img">' +
          (b.image && b.image.url ? printHtml({ url: b.image.url, caption: b.caption }, 'data-act="lb" ' + ref + ' data-i="0"', storyIdx % 2 ? "tilt-b" : "tilt-a") : (editing ? '<div class="cover-empty">No photo yet</div>' : "")) +
          '</div><div class="s-txt">' + E("heading", "h3", "", { ph: "Heading" }) + E("body", "div", "", { multi: 1, ph: "Tell the story…" }) + "</div></div>";
        break;
      case "video": {
        const link = safeUrl(b.link);
        h = '<div class="b-video">' + E("title", "h3", "media-title", { ph: "Title (optional)" });
        if (b.file && b.file.url) h += '<video controls playsinline preload="metadata" src="' + esc(b.file.url) + '"></video>' +
          (link ? '<a class="vid-link" href="' + esc(link) + '" target="_blank" rel="noopener"><span aria-hidden="true">&#9654;</span> ' + (/(drive|docs)\.google\./i.test(link) ? "Watch on Google Drive" : /youtu/i.test(link) ? "Watch on YouTube" : /vimeo/i.test(link) ? "Watch on Vimeo" : "Watch the video") + " ↗</a>" : "");
        else if (link) h += embedHtml(link, b.title || "Watch the video");
        else if (editing) h += '<p class="empty-note">No video yet. Choose Edit to add one.</p>';
        h += E("caption", "div", "media-cap", { multi: 1, ph: "Caption (optional)" }) + "</div>";
        break;
      }
      case "audio": {

  function carLayout(car, instant) {

    sl.forEach((s, j) => {

  /* ---------- audio player ----------
     Recordings prepared in the browser carry no length in the file, so the native bar
     can't place the time. This bar uses the length saved at upload, or works it out. */
  function playerOf(el) { return el && el.closest && el.closest(".player"); }
  function plDur(pl) {
    const a = pl.querySelector("audio"), d = a.duration;
    if (isFinite(d) && d > 0) return d;
    return +pl.dataset.dur || 0;
  }
  function plDraw(pl) {
    const a = pl.querySelector("audio"), d = plDur(pl), r = pl.querySelector("input"), t = pl.querySelector(".t"), b = pl.querySelector(".pp");
    const cur = pl._probe ? 0 : (a.currentTime || 0);
    if (!pl._drag) r.value = d ? Math.round(Math.min(cur / d, 1) * 1000) : 0;
    t.textContent = clock(cur) + " / " + (d ? clock(d) : "–:––");
    b.innerHTML = a.paused ? "&#9654;" : "&#10074;&#10074;";
    b.setAttribute("aria-label", a.paused ? "Play" : "Pause");
  }
  /* Learn the real length by asking the browser to jump to the end once, then come back.
     Done only when someone plays or moves the bar, so pages with many recordings stay light. */
  function plProbe(pl, then) {
    const a = pl.querySelector("audio");
    if (plDur(pl) || pl._probe) { if (!pl._probe) then(); else pl._then = then; return; }
    pl._probe = true; pl._then = then;
    pl.querySelector(".t").textContent = "Loading…";
    const go = () => { try { a.currentTime = 1e7; } catch (_) { pl._probe = false; then(); } };
    if (a.readyState >= 1) go(); else a.addEventListener("loadedmetadata", go, { once: true });
  }
  ["loadedmetadata", "durationchange", "timeupdate", "play", "pause", "ended", "seeked"].forEach(ev => app.addEventListener(ev, e => {
    const a = e.target; if (!a || a.tagName !== "AUDIO") return;
    const pl = playerOf(a); if (!pl) return;
    if (pl._probe && isFinite(a.duration) && a.duration > 0) {
      pl._probe = false;
      try { a.currentTime = 0; } catch (_) {}
      const f = pl._then; pl._then = null; if (f) f();
    }
    if (ev === "play") app.querySelectorAll(".player audio").forEach(o => { if (o !== a && !o.paused) o.pause(); });
    if (ev === "ended") { try { a.currentTime = 0; } catch (_) {} }
    plDraw(pl);
  }, true));
  app.addEventListener("input", e => {
    const pl = playerOf(e.target); if (!pl || e.target.type !== "range") return;
    pl._drag = true;
    const d = plDur(pl), t = pl.querySelector(".t");
    if (d) t.textContent = clock(e.target.value / 1000 * d) + " / " + clock(d);
  });
  app.addEventListener("change", e => {
    const pl = playerOf(e.target); if (!pl || e.target.type !== "range") return;
    const frac = e.target.value / 1000;
    plProbe(pl, () => {
      pl._drag = false;
      const a = pl.querySelector("audio"), d = plDur(pl);
      if (d) { try { a.currentTime = frac * d; } catch (_) {} }
      plDraw(pl);
    });
  });
  app.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".player .pp"); if (!b) return;
    e.stopPropagation();
    const pl = playerOf(b), a = pl.querySelector("audio");
    if (!a.paused) { a.pause(); return; }
    if (plDur(pl)) { a.play().catch(() => {}); return; }
    /* start (silently) inside the tap so the browser allows sound, then find the length */
    a.muted = true; a.play().catch(() => {});
    plProbe(pl, () => { a.muted = false; a.play().catch(() => {}); });
  }, true);
  /* lay audio photos out by their real shape so rows pack tightly */
  app.addEventListener("load", e => {
    const im = e.target; if (!im || im.tagName !== "IMG" || !im.naturalWidth) return;
    const car = im.closest(".car"); if (car) carLayout(car, true);
    const pr = im.parentElement; if (!pr || !pr.parentElement || !pr.parentElement.classList.contains("jgrid")) return;
    pr.style.setProperty("--r", (im.naturalWidth / im.naturalHeight).toFixed(3));
  }, true);
  app.addEventListener("toggle", e => {
    const d = e.target; if (!d || !d.dataset || !d.dataset.fold) return;
    if (d.open) openFolds.add(d.dataset.fold); else openFolds.delete(d.dataset.fold);
  }, true);

  /* ---------- song with words ----------
     Each line may start with a time like [1:05.2] (set by "Sync words to the song").
     Lines without one are spread between their timed neighbours by word count. */
  function lyrLines(txt) {
    return String(txt || "").split("\n").map(raw => {
      const m = /^\s*\[(\d+):(\d{1,2}(?:\.\d+)?)\]\s*/.exec(raw);
      return { t: m ? +m[1] * 60 + +m[2] : null, text: (m ? raw.slice(m[0].length) : raw).trim() };
    });
  }
  function stamp(t) { return Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0"); }
  function lyrTimes(lines, D) {
    const L = lines.filter(l => l.text).map(l => ({ t: l.t, w: l.text.split(/\s+/) }));
    if (!L.length) return [];
    if (L[0].t == null) L[0].t = 0;
    let last = 0;
    L.forEach(l => { if (l.t != null) { l.t = Math.max(l.t, last); last = l.t; } });
    const end = Math.max(D || 0, last + 1);
    for (let i = 1; i < L.length;) {
      if (L[i].t != null) { i++; continue; }
      let j = i; while (j < L.length && L[j].t == null) j++;
      const a = L[i - 1].t, z = j < L.length ? L[j].t : end;

    const t0 = ctx.currentTime;
    src.start();
    const tick = setInterval(() => { g.fillRect(0, 0, 16, 16); onProgress && onProgress(Math.min(ctx.currentTime - t0, buf.duration), buf.duration); }, 500);
    await ended;
    clearInterval(tick);
    rec.stop();
    await stopped;
    vs.getTracks().forEach(t => t.stop());
    ctx.close();
    const out = new Blob(chunks, { type: mime.indexOf("video/mp4") === 0 ? "video/mp4" : "video/webm" });
    out.dur = buf.duration;
    return out;
  }

  /* Videos over the size limit are re-recorded smaller in the browser: the picture is
     redrawn at a lower resolution and bit rate sized to fit, and the sound is carried over.
     Like the audio step, this runs in real time while the video plays silently. */
  async function shrinkVideo(file, onProgress, fill) {
    const mime = ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
      .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!mime || !AC) throw new Error("This browser can't make the video smaller. Try Chrome or Safari, or paste a YouTube link instead.");
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    const fail = msg => { URL.revokeObjectURL(url); return new Error(msg); };
    try {
      await new Promise((ok, no) => { v.onloadedmetadata = ok; v.onerror = no; });
    } catch (e) { throw fail("This video can't be read here. Save it as an MP4 and try again."); }
    const D = v.duration;
    if (!isFinite(D) || D <= 0) throw fail("This video can't be read here. Save it as an MP4 and try again.");
    if (D > 20 * 60) throw fail("This video is over 20 minutes. Trim it, or upload it to YouTube and paste the link.");
    const budget = (MAX * fill * 8) / D, aBits = budget > 600000 ? 96000 : 64000;
    const vBits = Math.min(2500000, Math.floor(budget - aBits));
    if (vBits < 180000) throw fail("This video is too long to fit in 20 MB. Trim it, or upload it to YouTube and paste the link.");
    const edge = vBits > 1400000 ? 1280 : vBits > 650000 ? 854 : 640;
    const sc = Math.min(1, edge / Math.max(v.videoWidth || edge, v.videoHeight || edge));
    const c = document.createElement("canvas");
    c.width = Math.max(2, Math.round((v.videoWidth || 640) * sc / 2) * 2);
    c.height = Math.max(2, Math.round((v.videoHeight || 360) * sc / 2) * 2);
    const g = c.getContext("2d");
    const vs = c.captureStream(30);
    /* sound: decoded separately so it records even though the video plays muted */
    const ctx = new AC(), dest = ctx.createMediaStreamDestination();
    let src = null;
    try {
      const buf = await ctx.decodeAudioData(await file.arrayBuffer());
      src = ctx.createBufferSource(); src.buffer = buf; src.connect(dest);
    } catch (e) { /* no sound track, or one this browser can't read: keep the picture */ }
    await ctx.resume();
    const tracks = [...vs.getVideoTracks()].concat(src ? dest.stream.getAudioTracks() : []);
    const rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mime, videoBitsPerSecond: vBits, audioBitsPerSecond: aBits });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    let done = false;
    const draw = () => {
      if (done) return;
      g.drawImage(v, 0, 0, c.width, c.height);
      if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(draw); else requestAnimationFrame(draw);
    };
    const ended = new Promise(r => { v.onended = r; });
    g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
    rec.start(1000);
    try { await v.play(); } catch (e) { rec.stop(); ctx.close(); throw fail("The video couldn't start. Keep this window in front and try again."); }
    if (src) src.start(0, v.currentTime);
    draw();
    const tick = setInterval(() => { onProgress && onProgress(Math.min(v.currentTime, D), D); }, 500);
    await ended;
    done = true;
    clearInterval(tick);
    rec.stop();
    await stopped;
    vs.getTracks().forEach(t => t.stop());
    try { src && src.stop(); } catch (_) {}
    ctx.close();
    URL.revokeObjectURL(url);
    return new Blob(chunks, { type: mime.indexOf("video/mp4") === 0 ? "video/mp4" : "video/webm" });
  }

  async function upload(file, kind, onProgress) {
    if (!ns.assets) throw new Error("Uploading isn't available in this view.");
    let blob = file, type;
    if (kind === "image") { const p = await prepImage(file); blob = p.blob; type = p.type; }
    else if (kind === "video") {
      try { type = mediaType(file, kind); } catch (e) { type = null; }
      if (!type || file.size > MAX) {
        blob = await shrinkVideo(file, onProgress, 0.85);
        /* recorders don't hit the bit rate exactly; if it came out too big, go again smaller */
        if (blob.size > MAX) blob = await shrinkVideo(file, onProgress, 0.85 * 0.85 * MAX / blob.size);
        type = blob.type;
      }
    }
    else type = mediaType(file, kind);
    let dur = 0;
    if (type === "convert") { blob = await audioToVideo(file, onProgress); type = blob.type; dur = blob.dur || 0; }
    if (blob.size > MAX) throw new Error(kind === "video" ? "Even made smaller, this video is over 20 MB. Trim it, or upload it to YouTube and paste the link." : "This file is over 20 MB. Try a smaller version.");
    try {
      const r = await ns.assets.upload(blob, { type: type });
      const out = { id: r.id, url: r.url, name: file.name };
      if (dur) out.dur = Math.round(dur * 100) / 100;
      return out;
    } catch (e) {
      const c = e && e.code;
      if (c === "too_large") throw new Error("This file is over the 20 MB limit.");
      if (c === "unsupported_type") throw new Error("That file type can't be stored here.");
      if (c === "quota_or_state") throw new Error("The site's storage is full. Remove some files and try again.");
      if (c === "rate_limited") throw new Error("Too many uploads at once. Wait a moment and try again.");
      throw new Error("The upload didn't go through. Try again.");
    }
  }

      try {
        const blob = await (await fetch(t.dataset.url)).blob();
        await ns.downloads.save({ filename: t.dataset.name, data: blob });
      } catch (err) {
        const c = err && err.code;
        if (c !== "declined") toast(c === "rejected_extension" ? "This file type can't be downloaded here." : "The download didn't start. Try again in a moment.");
      }
      return;
    }
    if (a === "lb") {
      const b = findBlk(pk, sid, bid);
      if (!b) return;
      const items = b.type === "photos" ? b.items.filter(x => x.url) : b.type === "audio" ? audioImgs(b) : b.type === "duo" ? (b.images || []).filter(x => x.url) : b.type === "lyrics" ? [{ url: b.image.url, caption: b.title }] : [{ url: b.image.url, caption: b.caption }];
      openLb(items, +t.dataset.i || 0); return;
    }
    if (a === "lb-cover") { const c = state.pages[pk].cover; openLb([c], 0); return; }
    if (a === "lb-share") { const p = state.pages[pk]; openLb([{ url: p.shareImg.url, caption: p.shareCap }], 0); return; }

    /* edit-only actions */
    if (!editing) return;
    const pg = state.pages[pk];
    if (a === "page-edit") {
      openDialog({ kind: "page", pk: pk, heading: "Edit page header", draft: { title: pg.title, lede: pg.lede, summary: pg.summary, by: pg.by, cover: pg.cover },
        commit: d => { if (d.lede !== pg.lede) delete pg.lede_h; pg.title = d.title || pg.title; pg.lede = d.lede; if (d.summary !== undefined) pg.summary = d.summary; if (d.by !== undefined) pg.by = d.by; pg.cover = d.cover || null; } });
    }
    if (a === "sec-add") {
      openDialog({ kind: "section", heading: "New section", isNew: true, draft: { title: "", kicker: "" },
        commit: d => {
          const nsec = { id: uid(), title: d.title, kicker: d.kicker, blocks: [] }, ri = pg.sections.findIndex(s => s.reflect);
          if (ri >= 0) pg.sections.splice(ri, 0, nsec); else pg.sections.push(nsec);
        } });
    }
    if (a === "lyr-sync") {
      const b = findBlk(pk, sid, bid), el = t.closest(".b-lyr"), au = el && el.querySelector("audio");
      if (!b || !el) return;
      const raw = String(b.lyrics || "").split("\n");
      const idx = raw.map((r, i) => lyrLines(r)[0].text ? i : -1).filter(i => i >= 0);
      app.querySelectorAll("audio").forEach(o => { if (!o.paused) o.pause(); });
      sync = { b: b, el: el, au: au, raw: raw, idx: idx, times: [], i: 0 };
      t.hidden = true; el.querySelector(".lyr-sync .live").hidden = false;
      if (au) {
        au.muted = false;
        try { au.currentTime = 0; } catch (_) {}
        au.play().catch(() => {});
      } else clkSet(el, true, 0);
      syncHint();
      return;
    }
    if (a === "lyr-mark") { syncMark(); return; }
    if (a === "cr-add" || a === "cr-up" || a === "cr-down" || a === "cr-del" || a === "cr-pin") {
      const b = findBlk(pk, sid, bid); if (!b) return;
      b.items = b.items || [];
      const i = +t.dataset.i;
      if (a === "cr-pin") { b.items[i].top = !b.items[i].top; changed(); return; }
      if (a === "cr-add") b.items.splice(i + 1, 0, { id: uid(), name: "", role: "" });
      if (a === "cr-up" || a === "cr-down") move(b.items, i, a === "cr-up" ? -1 : 1);
      if (a === "cr-del") {
        const key = "cr" + bid + i;
        if (!pendingDel[key]) { pendingDel[key] = 1; t.textContent = "Click again to delete"; t.classList.add("warn"); setTimeout(() => { delete pendingDel[key]; if (t.isConnected) { t.textContent = "Delete"; t.classList.remove("warn"); } }, 3500); return; }
        delete pendingDel[key];
        b.items.splice(i, 1);
      }
      changed();
      if (a === "cr-add") { const names = document.querySelectorAll(".credits .cr-name"); const el = names[i + 1]; if (el) el.focus(); }
      return;
    }
    if (a === "tl-add" || a === "tl-up" || a === "tl-down" || a === "tl-del") {
      const b = findBlk(pk, sid, bid); if (!b) return;
      b.items = b.items || [];
      const i = +t.dataset.i;
      if (a === "tl-add") b.items.splice(i + 1, 0, { id: uid(), time: "", text: "" });
      if (a === "tl-up" || a === "tl-down") move(b.items, i, a === "tl-up" ? -1 : 1);
      if (a === "tl-del") {
        const key = "tl" + bid + i;
        if (!pendingDel[key]) { pendingDel[key] = 1; t.textContent = "Click again to delete"; t.classList.add("warn"); setTimeout(() => { delete pendingDel[key]; if (t.isConnected) { t.textContent = "Delete moment"; t.classList.remove("warn"); } }, 3500); return; }
        delete pendingDel[key];
        b.items.splice(i, 1);
      }
      changed(); return;
    }
    if (a === "lyr-stop") { syncEnd(); return; }
    if (a === "sec-edit") {
      const s = findSec(pk, sid);
      openDialog({ kind: "section", heading: "Edit section", draft: { title: s.title, kicker: s.kicker }, commit: d => { if (d.title !== s.title) delete s.title_h; s.title = d.title; s.kicker = d.kicker; } });
    }
    if (a === "sec-up" || a === "sec-down") { move(pg.sections, pg.sections.findIndex(s => s.id === sid), a === "sec-up" ? -1 : 1); changed(); }
    if (a === "sec-del" || a === "blk-del") {
      const key = a + sid + (bid || "");
      if (!pendingDel[key]) { pendingDel[key] = 1; t.textContent = "Click again to delete"; t.classList.add("warn"); setTimeout(() => { delete pendingDel[key]; if (t.isConnected) { t.textContent = a === "sec-del" ? "Delete section" : "Delete"; t.classList.remove("warn"); } }, 3500); return; }
      delete pendingDel[key];
      if (a === "sec-del") pg.sections = pg.sections.filter(s => s.id !== sid);
      else { const s = findSec(pk, sid); s.blocks = s.blocks.filter(b => b.id !== bid); }
      changed();
    }
    if (a === "share-up") { shareKey = pk; shareInput.click(); return; }
    if (a === "share-rm") { pg.shareImg = null; changed(); return; }
    if (a === "blk-below") {
      insertAfter = insertAfter && insertAfter.s === sid && insertAfter.b === bid ? null : { s: sid, b: bid };
      render(); return;
    }
    if (a === "add") {
      const s = findSec(pk, sid), type = t.dataset.t, after = t.dataset.after;
      openDialog({ kind: type, heading: "Add " + TYPES[type].toLowerCase(), isNew: true, draft: { items: [], files: [], images: [] },
        commit: d => {
          const blk = Object.assign({ id: uid(), type: type }, d);
          if (type === "timeline" && !(blk.items || []).length) blk.items = [{ id: uid(), time: "", text: "" }];
          if (type === "lyrics" && s.carousel) setTimeout(() => { carSel[pk + "/" + s.id] = s.blocks.filter(x => x.type === "lyrics").indexOf(blk); carRestore(); }, 0);
          const i = after ? s.blocks.findIndex(b => b.id === after) : -1;
          if (i >= 0) s.blocks.splice(i + 1, 0, blk); else s.blocks.push(blk);
          insertAfter = null;
        } });
    }
    if (a === "blk-edit") {
      const b = findBlk(pk, sid, bid);
      const draft = clone(b);
      if (b.type === "audio") { draft.images = audioImgs(b).map(x => ({ id: x.id, url: x.url, caption: x.caption || "" })); delete draft.image; }
      if (b.type === "lyrics" && b.link) {
        if (/youtu/i.test(b.link) && !draft.youtube) draft.youtube = b.link; else if (!draft.spotify) draft.spotify = b.link;
        draft.link = "";
      }
      openDialog({ kind: b.type, heading: "Edit " + TYPES[b.type].toLowerCase(), draft: draft, commit: d => {
        Object.keys(d).forEach(k => { if (typeof d[k] === "string" && d[k] !== b[k] && (k + "_h") in d) { delete d[k + "_h"]; delete b[k + "_h"]; } });
        Object.assign(b, d); if (b.type === "audio") delete b.image; } });
    }
    if (a === "blk-up" || a === "blk-down") { const s = findSec(pk, sid); move(s.blocks, s.blocks.findIndex(b => b.id === bid), a === "blk-up" ? -1 : 1); changed(); }
  });

  /* ---------- routing & boot ---------- */
  function readHash() {
    const h = (location.hash || "").replace(/^#/, "");
    return PAGES.some(p => p.key === h) ? h : null;
  }
  window.addEventListener("hashchange", () => {
    const h = readHash();
    if (h && h !== route) { route = h; menuOpen = false; render(); window.scrollTo(0, 0); }
  });

  const ui = ss("sp-ui");
  route = readHash() || (ui && ui.route) || "home";
  const draft = ss("sp-draft");
  if (draft && draft.state && draft.state.pages) { try { norm(draft.state); } catch (_) {} }
  const fits = s => s && s.pages && PAGES.every(p => s.pages[p.key]);
  if (draft && (draft.rev === saved.rev || !fits(draft.state))) ss("sp-draft", null);
  else if (draft && draft.state) pendingDraft = catchUp(draft.state, draft.base);
  render();

  (async function connect() {
    if (!window.claude || !window.claude.use) return;
    try {
      const r = await Promise.all([claude.use("artifact"), claude.use("assets"), claude.use("downloads")]);
      ns.artifact = r[0]; ns.assets = r[1]; ns.downloads = r[2];
    } catch (e) { /* view-only */ }
    if (ns.assets && ns.artifact && ui && ui.editing) editing = true;
    render();
  })();
})();
</script>
</body></html>
