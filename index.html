<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Sharing Project</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Gloock&amp;family=Caveat:wght@500&amp;family=Figtree:wght@400;600&amp;display=swap">
<style id="sp-style">
/* Layout: a photo album on lake-mist paper. One reading column, photos as white-bordered prints, gold (the Odyssey) as the single accent. */
:root{
  --paper:#EDF0EE; --surface:#F8F9F7; --ink:#1B2630; --muted:#56626B; --line:#D2D8D5;
  --gold:#94690F; --gold-soft:#EBDDB5; --lake:#2C5466; --print:#FFFFFF; --print-ink:#2A2620;
  --danger:#A0352B; --shadow:0 1px 2px rgba(27,38,48,.10),0 6px 18px rgba(27,38,48,.10);
  --f-display:"EB Garamond",Garamond,"Times New Roman",serif;
  --f-body:"EB Garamond",Garamond,"Times New Roman",serif;
  --f-ui:"EB Garamond",Garamond,"Times New Roman",serif;
  --f-hand:"EB Garamond",Garamond,"Times New Roman",serif;
  --measure:40rem;
  /* domain colors */
  --c-creative:#3E8E57; --c-interdependent:#7A5AAF; --c-social:#E59E58; --c-embodied:#3B74B5; --c-emotional:#C23E38;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171C; --surface:#1A2229; --ink:#E7E5DF; --muted:#9EA8AF; --line:#2B353D;
  --gold:#D8AC50; --gold-soft:#3A3018; --lake:#8DB5C7; --print:#E9E6DF; --print-ink:#2A2620;
  --danger:#E08A80; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --c-creative:#6CC28A; --c-interdependent:#A88DDB; --c-social:#F2B67A; --c-embodied:#71A5E0; --c-emotional:#E56C63; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171C; --surface:#1A2229; --ink:#E7E5DF; --muted:#9EA8AF; --line:#2B353D;
  --gold:#D8AC50; --gold-soft:#3A3018; --lake:#8DB5C7; --print:#E9E6DF; --print-ink:#2A2620;
  --danger:#E08A80; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --c-creative:#6CC28A; --c-interdependent:#A88DDB; --c-social:#F2B67A; --c-embodied:#71A5E0; --c-emotional:#E56C63; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.2rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:var(--lake)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;line-height:1.12;margin:0}
.wrap{max-width:68rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-ui);font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;min-height:3.75rem}
.brand{font-family:var(--f-display);font-size:1.3rem;text-decoration:none;color:var(--ink);white-space:nowrap;margin-right:auto}
.nav{display:flex;gap:.15rem;flex-wrap:wrap;font-family:var(--f-ui);font-size:.9rem}
.nav a{text-decoration:none;color:var(--muted);padding:.4rem .6rem;border-radius:6px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--gold-soft)}
.nav .sep{width:1px;background:var(--line);margin:.35rem .3rem}
.menu-btn{display:none;font-family:var(--f-ui);font-size:.9rem;background:none;border:1px solid var(--line);border-radius:6px;padding:.4rem .7rem;cursor:pointer}
.edit-btn{font-family:var(--f-ui);font-size:.85rem;font-weight:500;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:.35rem .85rem;cursor:pointer;white-space:nowrap}
.edit-btn[aria-pressed="true"]{background:var(--gold);color:var(--paper)}
@media (max-width:1180px){
  .menu-btn{display:inline-block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:.5rem max(16px,env(safe-area-inset-right,0px)) 1rem max(16px,env(safe-area-inset-left,0px))}
  .nav.open{display:flex}
  .nav a{padding:.65rem .6rem;font-size:1rem}
  .nav .sep{width:auto;height:1px;margin:.3rem 0}
}

/* page header */
main{padding-block:2.5rem 5rem}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:3rem;align-items:center;padding-block:1.5rem 3rem}
.hero h1{font-size:clamp(2.6rem,7vw,5rem)}
.hero .lede{font-size:1.3rem;line-height:1.5;color:var(--muted);max-width:32rem;margin:1.25rem 0 0}
.hero .by{font-family:var(--f-ui);font-size:.9rem;color:var(--muted);margin-top:1rem}
.page-head{max-width:var(--measure);margin:0 auto;padding-block:1rem 2.5rem}
.page-head h1{font-size:clamp(2.4rem,6vw,4rem);margin-top:.4rem}
.page-head .cover{margin-top:2rem}
.epi{margin:1.75rem 0 0;font-size:1.2rem;line-height:1.6;color:var(--ink)}
.epi-label{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);margin-top:.75rem}
.epi p{margin:0}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:2rem}}
/* home photo sized so the photo and the start of the intro fit on the first screen */
.hero{padding-block:1rem 1.5rem}
.hero .print{width:fit-content;max-width:100%;margin-inline:auto}
.hero .print img{width:auto;max-height:min(46vh,30rem)}
@media (max-width:760px){.hero{gap:1.25rem}.hero .print img{max-height:34vh}}

/* prints (photos) */
.print{display:block;background:var(--print);padding:10px 10px 0;box-shadow:var(--shadow);border:0;cursor:zoom-in;text-align:left;width:100%}
.print img{display:block;width:100%;height:auto;max-width:100%}
.print .cap{display:block;font-family:var(--f-hand);font-style:italic;font-size:1.05rem;color:var(--print-ink);padding:.35rem .2rem .55rem;line-height:1.2;min-height:.9rem}
.tilt-a{transform:rotate(-1.2deg)} .tilt-b{transform:rotate(.9deg)}
.cover-empty{aspect-ratio:4/5;max-width:100%;display:grid;place-items:center;border:2px dashed var(--line);border-radius:4px;color:var(--muted);font-family:var(--f-ui);font-size:.9rem;text-align:center;padding:1rem}

/* sections & blocks */
.section{max-width:var(--measure);margin:0 auto;padding-block:1.5rem}
.section.wide{max-width:60rem}
.sec-head{margin-bottom:1.25rem;scroll-margin-top:8rem}
.sec-head h2{font-size:clamp(1.7rem,4vw,2.3rem)}
.sec-head .kicker{font-family:var(--f-ui);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.blocks{display:flex;flex-direction:column;gap:2.25rem}
.b-text h3{font-size:1.5rem;margin-bottom:.6rem}
.b-text p{margin:0 0 1em}
.b-text p:last-child{margin-bottom:0}
.b-text.essay p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:4.1rem;line-height:.85;padding:.35rem .5rem 0 0;color:var(--gold)}
.b-quote{margin:0;padding:.25rem 0 .25rem 1.4rem;border-left:2px solid var(--gold-soft)}
.b-quote blockquote{margin:0;font-style:italic;font-size:1.25rem;line-height:1.55}
.b-quote figcaption{font-family:var(--f-ui);font-size:.85rem;color:var(--muted);margin-top:.5rem}
.b-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:1.6rem;align-items:start}
.b-photos.one{grid-template-columns:1fr}
.b-photos.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.b-photos.two{grid-template-columns:1fr}}
.section.wide .b-photos{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.b-story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem;align-items:center}
.b-story.flip .s-img{order:2}
.b-story h3{font-size:1.45rem;margin-bottom:.5rem}
.b-story p{margin:0 0 .8em}
@media (max-width:640px){.b-story{grid-template-columns:1fr}.b-story.flip .s-img{order:0}}
.media-title{font-family:var(--f-display);font-size:1.3rem;margin:0 0 .5rem}
.media-cap{font-size:1rem;color:var(--muted);margin:.6rem 0 0}
.b-video video{display:block;width:100%;max-width:100%;background:#000;border-radius:3px;box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;display:flex;gap:1.1rem;align-items:center}
.card .grow{flex:1;min-width:0}
.card h3{font-size:1.25rem}
.card .sub{font-family:var(--f-ui);font-size:.9rem;color:var(--muted);margin-top:.15rem}
.card .note{font-size:1rem;margin:.6rem 0 0}
.b-audio{flex-wrap:wrap}
.b-audio .thumb{width:7.5rem;flex:none;padding:6px 6px 0;cursor:zoom-in}
.b-audio .thumb .cap{display:none}
.b-audio .thumb img{aspect-ratio:1;object-fit:cover}
.b-audio audio{width:100%;margin-top:.75rem;max-width:100%}
.b-aud{display:flex;flex-direction:column;gap:1rem}
.b-aud > .print{max-width:34rem}
.aud-bar{align-items:flex-start}
.player{display:flex;align-items:center;gap:.75rem;margin-top:.85rem}
.player .pp{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font:inherit;font-size:1rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.player .pp:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.player input[type=range]{flex:1;min-width:0;accent-color:var(--gold);height:1.6rem;margin:0}
.player .t{flex:none;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted,inherit);min-width:6.6rem;text-align:right}
@media (max-width:520px){.player .t{min-width:0;font-size:.8rem}}
.jgrid{display:flex;flex-wrap:wrap;gap:.6rem;max-width:100%}
.jgrid::after{content:"";flex:999 1 0}
.jgrid > .print{--r:1.333;flex:var(--r) 1 calc(var(--r) * 9.5rem);width:auto;padding:6px 6px 0;min-width:0}
.jgrid > .print img{aspect-ratio:var(--r);object-fit:cover;height:auto}
.jgrid > .print .cap{font-size:1rem;padding:.25rem .15rem .35rem}
.jgrid > .print .cap:empty{min-height:6px;padding:0}
.jgrid.one > .print{flex:0 1 calc(var(--r) * 20rem);max-width:100%}
.jgrid.one::after{display:none}
.disc{width:3.6rem;height:3.6rem;flex:none;border-radius:50%;background:radial-gradient(circle,var(--gold) 0 14%,var(--ink) 15% 17%,var(--lake) 18% 100%);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--surface) 30%,transparent)}
.doc-ico{width:3rem;height:3.6rem;flex:none;border:1.5px solid var(--muted);border-radius:3px 12px 3px 3px;display:grid;place-items:end center;padding-bottom:.4rem;font-family:var(--f-ui);font-size:.65rem;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--f-ui);font-size:.9rem;font-weight:500;border-radius:999px;padding:.5rem 1rem;text-decoration:none;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);white-space:nowrap}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.small{font-size:.8rem;padding:.3rem .7rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lesson{display:block}
.lesson .pills{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.pill{font-family:var(--f-ui);font-size:.75rem;padding:.2rem .6rem;border-radius:999px;background:var(--gold-soft);color:var(--ink)}
.lesson .files{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.25rem}
.empty-note{font-family:var(--f-ui);font-size:.95rem;color:var(--muted);padding:1.25rem;border:1px dashed var(--line);border-radius:10px;text-align:center}

/* home domain cards */
.domains{padding-block:3rem 1.5rem}
.domains > h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:1.75rem;text-align:left}
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.1rem}
@media (max-width:980px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.dgrid{grid-template-columns:1fr}}
.dcard{display:flex;flex-direction:column;gap:.6rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;transition:transform .15s,border-color .15s}
.dcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.dcard .ph{aspect-ratio:4/3;background:var(--paper);border-radius:4px;overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;color:var(--gold)}
.dcard .ph img{width:100%;height:100%;object-fit:cover}
.dcard h3{font-size:1.35rem}
.dcard p{margin:0;font-size:.98rem;line-height:1.5;color:var(--muted)}
.dcard .n{font-family:var(--f-ui);font-size:.75rem;color:var(--gold);font-weight:600;letter-spacing:.08em}
.dlist{display:flex;flex-direction:column;gap:1.25rem}
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.5rem;align-items:center;padding:1.75rem;background:var(--surface);border:1.5px solid var(--dc,var(--line));border-radius:12px}
.drow .d-txt .n{color:var(--dc,var(--gold))}
.drop.slim{aspect-ratio:auto;padding:1.4rem}
.drow.solo{grid-template-columns:minmax(0,1fr)}
.drow:nth-child(even):not(.solo) .d-photo{order:-1}
.d-txt{display:flex;flex-direction:column;gap:.6rem;align-items:flex-start;min-width:0}
.d-txt .n{font-family:var(--f-ui);font-size:.75rem;color:var(--gold);font-weight:600;letter-spacing:.1em}
.d-txt h3{font-size:clamp(1.8rem,4vw,2.4rem)}
.d-txt p,.d-txt .sum{margin:0;color:var(--muted);font-size:1.05rem;line-height:1.55;max-width:30rem}
.d-photo{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.share-h{font-family:var(--f-ui);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.share-cap{font-family:var(--f-hand);font-style:italic;font-size:1.15rem;color:var(--ink)}
.drop{aspect-ratio:4/3;width:100%;display:grid;place-items:center;border:2px dashed var(--gold);border-radius:6px;background:color-mix(in srgb,var(--gold-soft) 30%,transparent);color:var(--ink);font-family:var(--f-ui);font-size:.95rem;cursor:pointer}
.drop:hover{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
@media (max-width:700px){.drow{grid-template-columns:minmax(0,1fr);gap:1.5rem}.drow:nth-child(even):not(.solo) .d-photo{order:0}}

/* sense pills */
.senses{position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.8rem);z-index:10;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);padding-block:.7rem;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.senses .row{display:flex;gap:.5rem;overflow-x:auto;max-width:var(--measure);margin:0 auto;scrollbar-width:none}
.senses button{font-family:var(--f-ui);font-size:.9rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .9rem;cursor:pointer;white-space:nowrap}
.senses button small{color:var(--muted);font-size:.75rem;margin-left:.3rem}
.senses button:hover{border-color:var(--gold)}

/* prev/next */
.pager{max-width:var(--measure);margin:3.5rem auto 0;display:grid;grid-template-columns:1fr 1fr;gap:1rem;border-top:1px solid var(--line);padding-top:1.5rem}
.pager a{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:.15rem;padding:.6rem 0}
.pager a.next{text-align:right;grid-column:2}
.pager small{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.pager span{font-family:var(--f-display);font-size:1.4rem}
footer{border-top:1px solid var(--line);padding-block:2rem;font-family:var(--f-ui);font-size:.85rem;color:var(--muted)}

/* edit mode */
[data-ed]{cursor:text;border-radius:3px;outline:1px dashed color-mix(in srgb,var(--gold) 45%,transparent);outline-offset:4px;min-width:3rem}
[data-ed]:hover{outline-color:var(--gold)}
[data-ed]:focus{outline:2px solid var(--gold);background:color-mix(in srgb,var(--gold-soft) 40%,transparent)}
[data-ed].pre{white-space:pre-wrap}
[data-ed]:empty::before{content:attr(data-ph);color:var(--muted);font-family:var(--f-ui);font-size:.85rem;font-style:normal;letter-spacing:0;text-transform:none}
.ed-tools{display:none}
.editing .ed-tools{display:flex}
.ed-bar{gap:.35rem;flex-wrap:wrap;font-family:var(--f-ui)}
.ed-bar button,.ed-add button{font-family:var(--f-ui);font-size:.78rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:.25rem .55rem;cursor:pointer}
.ed-bar button:hover,.ed-add button:hover{border-color:var(--gold)}
.ed-bar button.warn{color:var(--danger);border-color:var(--danger)}
.editing .blk{position:relative;outline:1px dashed var(--line);outline-offset:10px;border-radius:2px}
.blk .ed-bar{position:absolute;top:-1.9rem;right:-10px;z-index:3}
.editing .blk{margin-top:1.4rem}
.ed-add{flex-wrap:wrap;gap:.4rem;align-items:center;padding:.8rem;border:1.5px dashed var(--gold);border-radius:10px;margin-top:1.5rem;background:color-mix(in srgb,var(--gold-soft) 35%,transparent)}
.ed-add .lbl{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);margin-right:.25rem}
.ed-add button.sug{border-color:var(--gold);font-weight:600}
.sec-tools{margin-top:.6rem}
.page-tools{margin:1rem 0 0}
.add-sec{justify-content:center;max-width:var(--measure);margin:2rem auto 0}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:.9rem;padding-block:.7rem calc(.7rem + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.savebar .msg{margin-right:auto}
.savebar .btn{background:var(--gold);border-color:var(--gold);color:#1B1408}
.savebar .btn.ghost{background:none;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 40%,transparent)}
.editing main{padding-bottom:8rem}
.banner{background:var(--gold-soft);font-family:var(--f-ui);font-size:.9rem}
.banner .wrap{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;padding-block:.6rem}
.banner .wrap span{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:.9rem;padding:.6rem 1rem;border-radius:8px;z-index:60;max-width:calc(100% - 32px)}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(36rem,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,14,18,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg header{padding:1.1rem 1.25rem .5rem;font-family:var(--f-display);font-size:1.4rem}
.dlg .body{padding:.5rem 1.25rem 1rem;overflow:auto;display:flex;flex-direction:column;gap:1rem}
.dlg .foot{display:flex;justify-content:flex-end;gap:.5rem;padding:.9rem 1.25rem;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:.3rem;font-family:var(--f-ui);font-size:.85rem}

<script id="sp-data" type="application/json">{"rev":"hfwpdi73","pages":{"home":{"title":"The Sharing Project","lede":"","by":"","cover":{"id":"b54f44e08c62e53545c7c229b7babe56","url":"media/b54f44e08c62e53545c7c229b7babe56.jpg","name":"IMG_0743.jpeg"},"sections":[{"id":"welcome","title":"Introduction","kicker":"","suggest":["text"],"blocks":[{"id":"welcome-text","type":"text","heading":"","body":"The Sharing Project is an exploration of the ways humans share. Humans have an incredible ability to share, across both space and time. The Sharing Project is a personal exploration of this ability under five domains: creative, social, emotional, embodied, and interdependent. "}]}]},"inspiration":{"title":"Inspiration","lede":"","cover":{"id":"e75289df29aab036cccbf9ac030f2177","url":"media/e75289df29aab036cccbf9ac030f2177.jpg","name":"IMG_0728.jpeg"},"sections":[{"id":"intro","title":"","kicker":"","suggest":["photos","story","text"],"blocks":[{"id":"essay-1","type":"text","heading":"","body":"There are only two people I know who have never turned on a computer.\n\nThe first is my Grandpa, who was born in 1939, and he has never turned on a computer in his life. Impressively, he never laid his enormous, scar-ridden fingers on a keyboard, never opened Safari or waited for a screen to load. He wouldn’t recognize the Windows symbol as more than four playful squares, and would certainly guess that the Apple symbol was a tiny mirror shaped like a common fruit.\n\n“I can hardly see my handsome face!” he’d say if he were looking at the back of my laptop.","essay":true},{"id":"essay-2","type":"text","heading":"","body":"It’s not that he didn’t have access to a computer. I sat at a desktop, which was tan, made dramatic clicking and whirring noises, and smelled of hard-working wires, mere feet from where he lay his head every night for over 20 years. I played countless hours of “Crazy Taxi” with my cousins while he was puttering around in his workshop. Eventually, he technically owned a laptop, one with a sticky note taped on the outside that contained all the passwords to access every penny he owned and his personal health information.\n\nBut Grandpa simply never had the need, or interest, to power on or flip open the machine around which my whole life now revolves. My Nana took care of it all. She had an email, paid the bills, and, of course, got scammed a few times in the digital world. Nana even got the hang of online shopping and supported Jeff Bezos in her last ten years.\n\nIf Grandpa ever needed to get in contact with anyone, he flipped through the Rolodex, found their number, and gave them a call on a large corded phone. If my he ever needed something, he would gas up the old gold minivan and drive himself, quickly, precisely, and sometimes dangerously, to the store it was most likely to be shelved in. If he couldn’t find it there, he’d wait to see it in newspaper coupons or in a magazine, point at it and beckon my Nana.\n\n“Helen, I found it!”"},{"id":"essay-3","type":"text","heading":"","body":"Now, Grandpa is in memory care. My Nana is gone, and there are no computers. The only technology he mentions now is the nonexistent telegram he received from his long-dead friend. The other day, he received news that he’d won the lottery, but only through Morse code. \n\nThe second person I know who has never turned on a computer is my baby niece. Not to compare, but I find her weeks-old streak much less impressive than my Grandpa’s 87-year-old one, especially considering she can’t even hold her own head upright."},{"id":"essay-4","type":"text","heading":"","body":"Both of these lives feels far away from me. In the last few months, my life has been thinking about and using computers in a large, inestimable number. The one-year graduate school program I began in August—Learning Design, Innovation, and Technology—has challenged me to think about computers into the night. In the course, we are asked to think about how to design technology, mostly digital, to improve education. And for the most part, I am in amazement. I’m inspired by my professors’ and my peers’ work; they’ve made places and tools for children to play and express themselves and created ways to improve access to education.\n\nI am also deeply grateful for how technology has changed the lives of children in special education, those who otherwise would not be able to share their incredible ideas and beautiful feelings with the world. I hopeful that we can move education towards intent.\n\nWe have also been taught to be cautious, and I have experienced unease technology, namely AI platforms. My professor warns us of the unpredictable nature of AI-written platforms and the effects they have on early childhood; my peers are wary of the effects it’s having on their understanding, and my friends who are high school teachers are frustrated by the AI-written papers turned in by students.\n\nWe are white-knuckling our way into the future. And as I attempt to think responsibly and optimistically about this technology, I think about these two people, the old man and this baby girl, who exist outside of the digital world, outside of memory, on the opposite ends of life. I think about what Grandpa shared with others, without computers, outside of “sharing\" an Instagram post or a Google Drive folder, that made Grandpa’s life, by all accounts, so miraculous and full. And I think, if people share his life the way he did, in the five domains, but not exclusively these, then we will optimize our use of tools for ourselves and for the common good."},{"id":"ph-creative","type":"photos","title":"","items":[{"id":"b9cd5cfce236072065c9a2dd54891039","url":"media/b9cd5cfce236072065c9a2dd54891039.jpg","caption":""},{"id":"82aa3e4adf8cf697597ae50079e2679a","url":"media/82aa3e4adf8cf697597ae50079e2679a.jpg","caption":""}]},{"id":"dom-creative","type":"text","heading":"Creative","body":"Grandpa shared his creativity, not in oil painting or story writing, but in other, expectedly useful ways. Upon noticing that most of the crayons in our blue plastic box were broken, he found a block of wood and drilled 100 uniform holes into it, placing a new set of crayons carefully upright. After angrily observing the squirrels climbing the porch railing and eating from his bird feeder, he greased up the deck with a thick oil. After the squirrels figured out that they could jump from the opposite railing, he pulled out his BB gun."},{"id":"ph-embodied","type":"photos","title":"","items":[{"id":"5d2cd29f5f4fc1b05d02e2baa70ff8f1","url":"media/5d2cd29f5f4fc1b05d02e2baa70ff8f1.jpg","caption":""},{"id":"15d744068d405833e1fc4d3be05be256","url":"media/15d744068d405833e1fc4d3be05be256.jpg","caption":""},{"id":"e3b0082ce3bea55050baecc1e5347a0b","url":"media/e3b0082ce3bea55050baecc1e5347a0b.jpg","caption":""}]},{"id":"dom-embodied","type":"text","heading":"Embodied","body":"Grandpa lived in his body. He loved to swim in the lake after dinner and ride his bike to the mailbox. He loved the years he spent skiing with the other firefighters and his many years tearing it up on the dance floor at weddings. He loved to boat and to snowmobile. He liked the way water was glassy smooth in the morning. He cooked a lot of fatty bacon. He tapped his knee to Dwayne Eddie’s guitar sound in Ghost Riders in the Sky. He loved or hated every food that he tried—the best thing he’d ever tasted or absolutely disgusting, too salty or too bland. Like a good Irishman, he indulged in whiskey. He loved a certain kind of sock, and each pair of shoes was the comfortable pair he had ever worn. Most of all, he loved dessert."},{"id":"ph-social","type":"photos","title":"","items":[{"id":"d03f9ac0fff768e5a96b58cd71ec1153","url":"media/d03f9ac0fff768e5a96b58cd71ec1153.jpg","caption":""},{"id":"967d4a8b3f1cc368d49fda7cdae34b53","url":"media/967d4a8b3f1cc368d49fda7cdae34b53.jpg","caption":""},{"id":"f0c4d771fa12d4aec1826ff4b3f36d84","url":"media/f0c4d771fa12d4aec1826ff4b3f36d84.jpg","caption":""},{"id":"0a9d643ca1ef95c712399098e6a0ec0f","url":"media/0a9d643ca1ef95c712399098e6a0ec0f.jpg","caption":""},{"id":"899377066013cd5327ed194af0611b17","url":"media/899377066013cd5327ed194af0611b17.jpg","caption":""}]},{"id":"dom-social","type":"text","heading":"Social","body":"Grandpa gathered and connected with as many people as he could. There was nothing he liked more than to be with people, to share music, food, and a drink (or ten) with new friends, old acquaintances, and family. He and my Nana once invited their mailwoman over for lunch. It makes me happy to think of the mailwoman, in her blue shorts, eating a Reuben sandwich with Ed Donnelly. What did they talk about?"},{"id":"ph-interdependent","type":"photos","title":"","items":[{"id":"17553696d5e112e95a3798b88de319de","url":"media/17553696d5e112e95a3798b88de319de.jpg","caption":""},{"id":"027149b04e7cc56aa35e71299d92eeeb","url":"media/027149b04e7cc56aa35e71299d92eeeb.jpg","caption":""},{"id":"601fee7dcbd2bc57ad62338e4b5d3dc5","url":"media/601fee7dcbd2bc57ad62338e4b5d3dc5.jpg","caption":""},{"id":"e5781230cc8fa667873e686ace9fc926","url":"media/e5781230cc8fa667873e686ace9fc926.jpg","caption":""},{"id":"1c801e1206bac90d5011d859f9c5ed86","url":"media/1c801e1206bac90d5011d859f9c5ed86.jpg","caption":""},{"id":"c5f34d535c5849e9d26fffcbd89c8ea8","url":"media/c5f34d535c5849e9d26fffcbd89c8ea8.jpg","caption":""},{"id":"9ed8616295265a8b38eab307e6be4dfa","url":"media/9ed8616295265a8b38eab307e6be4dfa.jpg","caption":""},{"id":"4911200d558d766e279de13c537de1b7","url":"media/4911200d558d766e279de13c537de1b7.jpg","caption":""}]},{"id":"dom-interdependent","type":"text","heading":"Interdependent","body":"Grandpa was the most generous with his resources, his time, his care. For over 30 years, he was a firefighter in New York City. He ran into a burning building while off duty, saving five people. He was one of the first EMTs in NYC. He continued to share his service by driving—although after his retirement, he no longer needed to navigate the 50-foot fire trucks through the tight grid of Manhattan, but through the winding back roads of New Hampshire. He drove me to track practice, asking me if I would win for him. He drove my cousin Brady to school every day, picking up donuts and pointing out the prison on every ride. He drove to Maryland to help fix my second cousin's door. He drove to visit us in college, sometimes illegally parking on the main quads. He would travel down any road, for anyone."},{"id":"ph-emotional","type":"photos","title":"","items":[{"id":"58184205b5b1209b319129c27a74ee16","url":"media/58184205b5b1209b319129c27a74ee16.jpg","caption":""},{"id":"2c11bbc0b5e85dccd1d6a3de6e6f3796","url":"media/2c11bbc0b5e85dccd1d6a3de6e6f3796.jpg","caption":""},{"id":"28067cda84e0f67c4d960bfa6daf8814","url":"media/28067cda84e0f67c4d960bfa6daf8814.jpg","caption":""},{"id":"104f9e8195e5473f609e79b0aaf6f34d","url":"media/104f9e8195e5473f609e79b0aaf6f34d.jpg","caption":""},{"id":"3aa94f0afc9121034a9816b38931973d","url":"media/3aa94f0afc9121034a9816b38931973d.jpg","caption":""}]},{"id":"dom-emotional","type":"text","heading":"Emotional","body":"Grandpa shared his stories and how he felt. He vaguely remembered the feeling of excitement when World War II ended, the confetti falling on the streets of Brooklyn. He remembered the joy of winning a dance competition at age 18 to “Rock Around the Clock” by Bill Haley and the Comets. He felt sadness and pride for his firefighter friends who saved lives and lost their own in the Twin Towers. He laughed at the time he accidentally fed hummingbird juice to my cousin Anthony, or when I killed the grass in the shape of my name because I liked how it turned bright green when I sprayed it with bug spray. He would smile and say “the best” when he looked at pictures of him holding me and my twin brother in his arms. These emotions colored his life, making something worth remembering."},{"id":"closing-text","type":"text","heading":"","body":"The only reason I know about these things is that he shared them. He lived them in front of our eyes or told us about them.\n\nIn these five ways, Grandpa’s life is a case study in what makes us distinct as humans. Computers and AI aren't creative, don't have empathy to care for others, don't form connections with anyone, don't live an embodied life, and don't feel or remember emotions. They are tools (and can be very helpful ones!). I was able to make this website and share these sentiments with you because of these technologies.\n\nI don’t expect baby girl to live a life without computers, without social media, without AI. But I hope, as his life ends and hers begins, that she continues to share the ways that made Grandpa’s life so beautiful. And in my wildest dreams, my niece drives a gold Honda Odyssey.\n\nThis project tries to remember and carry forward what Grandpa shared with us into the world my niece has just entered."}]},{"id":"gallery","title":"","kicker":"","wide":true,"suggest":["photos"],"blocks":[]}]},"creative":{"title":"Creative","summary":"A block of wood with 100 drilled holes for unbroken crayons.","lede":"My Shared Creative Experience:  “One Pot Restaurant”\nA chopped style competition with Frances’ Pot\n\n\nMode of Documentation: Video","cover":null,"sections":[{"id":"cr-1","title":"Preparation","kicker":"","wide":true,"duo":true,"suggest":["duo","text"],"blocks":[{"id":"gscn9cfr","type":"photos","items":[{"id":"1901b0db339fe844b3a6745305355d55","url":"media/1901b0db339fe844b3a6745305355d55.png","caption":""}],"files":[],"images":[],"title":"","link":""},{"id":"crd-1","type":"duo","images":[{"id":"d329f35c8e045adce5952587ed023a6b","url":"media/d329f35c8e045adce5952587ed023a6b.png","caption":""}],"file":null,"link":"https://drive.google.com/file/d/1zjTL8C3AAjnmBaJPt4mcNDoXRafDeZky/view?usp=drive_link","caption":""}]},{"id":"cr-2","title":"Appetizer","kicker":"","wide":true,"duo":true,"suggest":["duo","text"],"blocks":[{"id":"y2wxxme4","type":"photos","items":[{"id":"a8aa778429ce34af772808d98be436cb","url":"media/a8aa778429ce34af772808d98be436cb.png","caption":""}],"files":[],"images":[],"title":"","link":""},{"id":"crd-2","type":"duo","images":[{"id":"96a47b7e79050009b9f73cc2eea4990c","url":"media/96a47b7e79050009b9f73cc2eea4990c.png","caption":""},{"id":"e5b26f3cb1432ffa7bb4b1b8a83ae7eb","url":"media/e5b26f3cb1432ffa7bb4b1b8a83ae7eb.png","caption":""},{"id":"20782b2ddad2b5bc8f4fd23b268bd1a2","url":"media/20782b2ddad2b5bc8f4fd23b268bd1a2.png","caption":""}],"file":null,"link":"https://drive.google.com/file/d/1PcHQBCQ0v7erdrHRGyBZMQrZWmbBrvT8/view?usp=sharing","caption":""}]},{"id":"cr-3","title":"Main Course","kicker":"","wide":true,"duo":true,"suggest":["duo","text"],"blocks":[{"id":"5osn339k","type":"photos","items":[{"id":"63bcf85176916aea2489616e90840a21","url":"media/63bcf85176916aea2489616e90840a21.png","caption":""}],"files":[],"images":[],"title":"","link":""},{"id":"crd-3","type":"duo","images":[{"id":"0abefac67b310bfb8b4efe5c5685e343","url":"media/0abefac67b310bfb8b4efe5c5685e343.png","caption":""},{"id":"9e661e51306731bc12ae333abfa777c8","url":"media/9e661e51306731bc12ae333abfa777c8.png","caption":""},{"id":"51cd42b935348eab3081a8bd75194f27","url":"media/51cd42b935348eab3081a8bd75194f27.png","caption":""}],"file":null,"link":"https://drive.google.com/file/d/1J63gMpQXx4hfMhuyvsMLqVEEZn8WR5g6/view?usp=drive_link","caption":""}]},{"id":"cr-4","title":"Dessert","kicker":"","wide":true,"duo":true,"suggest":["duo","text"],"blocks":[{"id":"mrwbicvp","type":"photos","items":[{"id":"0da88e3ca44612d74aa0cc166a52f7cd","url":"media/0da88e3ca44612d74aa0cc166a52f7cd.png","caption":""}],"files":[],"images":[],"title":"","link":""},{"id":"crd-4","type":"duo","images":[{"id":"88658b418992dbf644dbcfe77123ae2c","url":"media/88658b418992dbf644dbcfe77123ae2c.png","caption":""},{"id":"b5e8525715684cf1d0b51fde735504ed","url":"media/b5e8525715684cf1d0b51fde735504ed.png","caption":""},{"id":"3a21f06fdbca5988bbc242fb9aec7468","url":"media/3a21f06fdbca5988bbc242fb9aec7468.png","caption":""}],"file":null,"link":"https://drive.google.com/file/d/1jmILIv4JyxjLLCgtA13xdL-fIhrgKtAo/view?usp=sharing","caption":""}]},{"id":"cr-5","title":"Debrief","kicker":"","wide":true,"duo":true,"suggest":["duo","text"],"blocks":[{"id":"j81q5etn","type":"photos","items":[{"id":"4145363ffb4cfb007356f3dd4a2fb33c","url":"media/4145363ffb4cfb007356f3dd4a2fb33c.png","caption":""}],"files":[],"images":[],"title":"","link":""},{"id":"crd-5","type":"duo","images":[],"file":null,"link":"https://drive.google.com/file/d/1cLkZMjRtrhyyRymybq8SQ2kWgYmTEKpb/view?usp=sharing","caption":""}]},{"id":"reflection","title":"Reflection","kicker":"","reflect":true,"suggest":["text","quote","photos"],"blocks":[{"id":"aa2n6mgf","type":"text","items":[],"files":[],"images":[],"heading":"","body":"My obsession with Frances started long before “One Pot Restaurant,” the experience we had together for the sake of this project. It began months before, in June, when we were part of the same small group for a prerequisite online course we needed to take for the degree program.\n\n\nFor the first part of the course, I was the only consistent attendee of the Sunday morning office hours hosted by the Teaching Fellows. Typically, the sessions were me, one other student, and the two of them, who had to adapt their schedule based on the low numbers. It was, at its best, 75 percent awkward silence.\n\n\nBy the third session, they were calling me the main character, and I felt weird about not returning for the next week. Thankfully, a few minutes into a meeting where no one but myself had shown up, Frances appeared on screen. She was videoing in from Malaysia, sitting on some large white cushion. “Oh thank god Frances is here,” I said in the chat. And so it began.\n\n\nWhen Frances showed up in the next meeting, I simply wrote “FRANCES.” At the one after that, I referenced her as my soulmate. The others on the call barely cracked a smile, and Frances did not respond.\n\n\nDuring our final papers, the teaching fellow commented that she happily placed Frances and me together for our peer review. I wondered if she knew I had never met or spoken to Frances, virtually or otherwise, and that my chat spam was an attempt at across-the-world camaraderie.\n\n\nA few weeks later, during orientation on campus, I sat at a round table next to Alisa, whom I had just at the breakfast buffet. I asked her what amount of Greek yogurt was considered inappropriate. She looked at it with alarm and shook her head. “It's too much yogurt in one spot,” she said.\n\n\nThen, it was a miracle. Straight from my screen to the seat next to me, she was there. The higher powers, sending me my virtual non-acquaintance, found me.\n\n\n“Frances?!” I said, leaning in. “It’s Jenny. Jenny from HPL.” I wondered, for a moment, if she’d be afraid of me. It would be justified.\n\n\n“JENNY?” Frances eyes became large. “No way. I didn’t think you really existed.” \n\n\nOver the next few weeks, I ramped up the excitement I started in the digital world. When I saw her in the library, I threw my backpack on the ground and jumped up and down. She would bend over laughing.\n\n\nMy show was dramatic but not erroneous. I was authentically excited to see the woman. She was the funniest person in the program. I liked the way she viewed the world, the way she phrased her sentences, and her tendency to be frustrated and overjoyed in the span of 10 minutes. I was riveted by her stories, which spanned from an overload of events that needed further elaboration to “Seinfeld-esque” tales in which nothing ever happens. One day she told a 30-second tale in which she went on a great date and then her company employee quit and then her laptop broke. Another day, she spent 10 minutes telling me about a question on her assignment that she thought she got wrong, and it was true; she did get it wrong.\n\n\nA month into the program, as our August term ended, Frances made an announcement. She had been living off ramen and the pesto sandwiches they were giving out at commencement events.\n\n\n“My pot is arriving today.” She said to me, even before a greeting. She held up a photo of it on her tablet. \n\n\n“Beautiful,” I said. “Will you get another?”\n\n\n“Just one! It’s all I need.” This was my kind of person—a minimalist. \n\n\nI’ve been known to have as few items as possible. My roommate in college said my bedroom looked like a rehab. “Jenny, you’re scaring me,” she said, looking at blank walls. \n\n\n“I have photos!” I protested, pointing at the three 4x6 photos that lay on my desk. \n\n\nFor the next months, I asked Frances what she cooked in her pot. Most of the time it was pasta. But of course, the pot was just the beginning, the origin of her adventures. She would sometimes skip over the pasta and talk about the heat of her dorm, the shopping trip she made, the suspected scam interview, or the people who ate the food from the pot. It was conversation well that never dried up.\n\n\nWhen given complete agency over a semester-long project, I immediately thought of Frances and her beloved. I ignored anything I had learned in my program about design, and centered Frances’ one pot, an idea without a purpose, a problem to solve, or a mission to help others learn. It was just fun, and funny.\n\n\nI hurt my head thinking of ways to make three months of the world revolve around Frances in her dorm kitchen. I scraped the barrel to connect it with theory: Creativity thriving? Attachment to material objects? Theories around togetherness and food? Maybe it could be a fashion statement. Maybe we could melt the metal of the pot and make a sculpture of Frances herself. Maybe one person could make a meal in the pot and give it to the next person.\n\n\nFor a devastating moment, I thought I had to move on, placing the pot next to my other unborn ideas, such as Inchworm Dermatologist, Pig Snake, Boatercycle, and The 99 (Restaurant) on the 99.** I had to pick another project (this one). It wasn’t meant for me.\n\n\nBut of course, it all comes back to the pot, and “One-Pot Restaurant” was born. I had stuffed Frances’ pot back in! \n\n\nI couldn’t help but think I had deceived myself into thinking this project was about something else, more grand and earnest. Subconsciously, I had found my way back home, to the burned surface of that lovely pot.\n\n\nIt must have been fate that kept that one pot sticky in my mind for “One Pot Restaurant,\" if I do say so myself, was a great success. This success was certainly not due any of the food that resulted, but in that it was an extreme exercise in sharing in creativity.\n\n\nAlisa, who was in charge of selecting the ingredients, had to think about the dishes Frances would be capable of making in a single pot. She said she had to amend the list after Lindsay said it was too extreme. I can only imagine the results that would have followed her first draft.\n\n\nThe dishes speak for themselves: guacamole with crushed Swedish crackers, soggy flaming hot Cheeto tofu nachos, and boiling cream cheese banana pudding are all, to me, definitions of creative investment.\n\n\nFrances and I had to collaborate on a shared vision for our dishes. We had different ideas about the creative process. I wanted a planning sheet; Frances wanted pedal to the metal. I liked to put ingredients away after they were used; Frances liked to keep them out in case we needed them. Sometimes communication crumbled (ie., the garlic powder incident), and tears were shed, but we made it through. \n\n\nMoe, a classmate who judged the dishes from photographs, had used only visuals to make astute critiques of our dishes.\n\n\nThe judging process required creativity as well. In a lot of the cut footage, you can see Lindsay thinking deeply in order to find a compliment about the three piles of crunchy mush set in front of them. Alisa took a different approach, one of a top chef judge, putting on a stern personality.\n\n\nI knew the pot, despite its price and the questionable ethical manufacturing processes to make it, was important. It had the power to supply countless stories, to ruin my kitchen and make me feel sick, and to bring people together in a creative pursuit. \n\n\nThis week, I will get Frances a new pot, mostly because I’m worried about the toxicity of the material over time with frequent use, but also because I can’t wait to see what stories can arise out of two pots.","body_h":"My obsession with Frances started long before “One Pot Restaurant,” the experience we had together for the sake of this project. It began months before, in June, when we were part of the same small group for a prerequisite online course we needed to take for the degree program.\u003cdiv>\u003cbr>\u003cdiv>For the first part of the course, I was the only consistent attendee of the Sunday morning office hours hosted by the Teaching Fellows. Typically, the sessions were me, one other student, and the two of them, who had to adapt their schedule based on the low numbers. It was, at its best, 75 percent awkward silence.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>By the third session, they were calling me the main character, and I felt weird about not returning for the next week. Thankfully, a few minutes into a meeting where no one but myself had shown up, Frances appeared on screen. She was videoing in from Malaysia, sitting on some large white cushion. “Oh thank god Frances is here,” I said in the chat. And so it began.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>When Frances showed up in the next meeting, I simply wrote “FRANCES.” At the one after that, I referenced her as my soulmate. The others on the call barely cracked a smile, and Frances did not respond.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>During our final papers, the teaching fellow commented that she happily placed Frances and me together for our peer review. I wondered if she knew I had never met or spoken to Frances, virtually or otherwise, and that my chat spam was an attempt at across-the-world camaraderie.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>A few weeks later, during orientation on campus, I sat at a round table next to Alisa, whom I had just at the breakfast buffet. I asked her what amount of Greek yogurt was considered inappropriate. She looked at it with alarm and shook her head. “It's too much yogurt in one spot,” she said.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Then, it was a miracle. Straight from my screen to the seat next to me, she was there. The higher powers, sending me my virtual non-acquaintance, found me.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>“Frances?!” I said, leaning in. “It’s Jenny. Jenny from HPL.” I wondered, for a moment, if she’d be afraid of me. It would be justified.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>“JENNY?” Frances eyes became large. “No way. I didn’t think you really existed.” \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Over the next few weeks, I ramped up the excitement I started in the digital world. When I saw her in the library, I threw my backpack on the ground and jumped up and down. She would bend over laughing.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>My show was dramatic but not erroneous. I was authentically excited to see the woman. She was the funniest person in the program. I liked the way she viewed the world, the way she phrased her sentences, and her tendency to be frustrated and overjoyed in the span of 10 minutes. I was riveted by her stories, which spanned from an overload of events that needed further elaboration to “Seinfeld-esque” tales in which nothing ever happens. One day she told a 30-second tale in which she went on a great date and then her company employee quit and then her laptop broke. Another day, she spent 10 minutes telling me about a question on her assignment that she thought she got wrong, and it was true; she did get it wrong.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>A month into the program, as our August term ended, Frances made an announcement. She had been living off ramen and the pesto sandwiches they were giving out at commencement events.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>“My pot is arriving today.” She said to me, even before a greeting. She held up a photo of it on her tablet. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>“Beautiful,” I said. “Will you get another?”\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>“Just one! It’s all I need.” This was my kind of person—a minimalist. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>I’ve been known to have as few items as possible. My roommate in college said my bedroom looked like a rehab. “Jenny, you’re scaring me,” she said, looking at blank walls. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>“I have photos!” I protested, pointing at the three 4x6 photos that lay on my desk. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>For the next months, I asked Frances what she cooked in her pot. Most of the time it was pasta. But of course, the pot was just the beginning, the origin of her adventures. She would sometimes skip over the pasta and talk about the heat of her dorm, the shopping trip she made, the suspected scam interview, or the people who ate the food from the pot. It was conversation well that never dried up.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>When given complete agency over a semester-long project, I immediately thought of Frances and her beloved. I ignored anything I had learned in my program about design, and centered Frances’ one pot, an idea without a purpose, a problem to solve, or a mission to help others learn. It was just fun, and funny.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>I hurt my head thinking of ways to make three months of the world revolve around Frances in her dorm kitchen. I scraped the barrel to connect it with theory: Creativity thriving? Attachment to material objects? Theories around togetherness and food? Maybe it could be a fashion statement. Maybe we could melt the metal of the pot and make a sculpture of Frances herself. Maybe one person could make a meal in the pot and give it to the next person.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>For a devastating moment, I thought I had to move on, placing the pot next to my other unborn ideas, such as Inchworm Dermatologist, Pig Snake, Boatercycle, and The 99 (Restaurant) on the 99.** I had to pick another project (this one). It wasn’t meant for me.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>But of course, it all comes back to the pot, and “One-Pot Restaurant” was born. I had stuffed Frances’ pot back in! \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>I couldn’t help but think I had deceived myself into thinking this project was about something else, more grand and earnest. Subconsciously, I had found my way back home, to the burned surface of that lovely pot.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>It must have been fate that kept that one pot sticky in my mind for “One Pot Restaurant,\" if I do say so myself, was a great success. This success was certainly not due any of the food that resulted, but in that it was an extreme exercise in sharing in creativity.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Alisa, who was in charge of selecting the ingredients, had to think about the dishes Frances would be capable of making in a single pot. She said she had to amend the list after Lindsay said it was too extreme. I can only imagine the results that would have followed her first draft.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>The dishes speak for themselves: guacamole with crushed Swedish crackers, soggy flaming hot Cheeto tofu nachos, and boiling cream cheese banana pudding are all, to me, definitions of creative investment.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Frances and I had to collaborate on a shared vision for our dishes. We had different ideas about the creative process. I wanted a planning sheet; Frances wanted pedal to the metal. I liked to put ingredients away after they were used; Frances liked to keep them out in case we needed them. Sometimes communication crumbled (ie., the garlic powder incident), and tears were shed, but we made it through. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Moe, a classmate who judged the dishes from photographs, had used only visuals to make astute critiques of our dishes.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>The judging process required creativity as well. In a lot of the cut footage, you can see Lindsay thinking deeply in order to find a compliment about the three piles of crunchy mush set in front of them. Alisa took a different approach, one of a top chef judge, putting on a stern personality.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>I knew the pot, despite its price and the questionable ethical manufacturing processes to make it, was important. It had the power to supply countless stories, to ruin my kitchen and make me feel sick, and to bring people together in a creative pursuit. \u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>This week, I will get Frances a new pot, mostly because I’m worried about the toxicity of the material over time with frequent use, but also because I can’t wait to see what stories can arise out of two pots.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003c/div>"}]}],"shareTitle":"Sharing a Creative experience","shareImg":null,"shareCap":"","lede_h":"\u003cspan style=\"font-weight: bold;\">My Shared Creative Experience:  \u003c/span>“One Pot Restaurant”\u003cbr>\u003cspan style=\"font-style: italic;\">A chopped style competition with Frances’ Pot\u003c/span>\u003cdiv>\u003cspan style=\"font-style: italic;\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cb>Mode of Documentation: \u003c/b>Video\u003c/div>"},"embodied":{"title":"Embodied","summary":"The lake after dinner, fatty bacon, and dessert above all.","lede":"","cover":null,"sections":[{"id":"touch","title":"Touch & Body Awareness","kicker":"Somatosensory","suggest":["photos"],"blocks":[{"id":"xvk79cbv","type":"text","items":[],"files":[],"images":[],"heading":"","body":"","body_h":"","heading_h":""},{"id":"7f9nshx2","type":"text","items":[],"files":[],"images":[],"heading":"","body":"My first advising meeting for graduate school was on the deck of the library. It was sunny, so I could barely see my fellow advisees as I quietly introduced myself. It was the end of summer, when the heat doesn’t seem to go away, when you just want to get a move on.\n\nA few months later, I was lying, face up and eyes closed, in the exact same spot where my heavy wooden chair had been during that commencement into the school year. If my end-of-summer self had seen a photo of the future, she might have concerned herself with the mental tax of the next two or so months.\n\nShe would see it was okay, though, because I was lying with ten other people. Or maybe she would have been more concerned?\n\nThe event that brought me there was advertised in one of my classes as “body mapping.” I had no idea what that meant, but I knew of the woman running it and also knew polar plunges, the event I was planning for my somatosensory sharing experiences, weren’t happening until February.\n\nI arrived on the deck and took off my shoes as I was instructed to. I silently asked my physical therapist for forgiveness. During the first appointment, she inspected my feet and legs like I was a car, and then sternly warned me never to be barefoot again.\n\nAs I lay there, peeking through my eyelashes, I imagined the drone shot. From above, this gathering surely looked like Heaven’s Gate, a cult in the 1990s that decided to all lace up their Nikes, drink poison, and lie face up in preparation for the Hale-Bopp comet, which would destroy the Earth. (I can see how “Just do it” was an apt slogan for them. The head of Nike Marketing must’ve had an absolute meltdown.)\n\nI liked the imagery the leader of the session replaced it with better: we were asked to imagine we were holding a flower, then that we were breathing in golden air, and then that we were being stretched a million miles in each direction.\n\nI don’t typically spend time relaxing my body like this, to scan where there is tension. I’ve been asked to do so during hot yoga, but I found the man snoring next to me, the suffocating temperatures, and the sweat rolling into my ears distracting.\n\nI decided to weigh my options; analysis was my only way into this impromptu physical meditation practice.\n\nFirst, I thought of my physical therapist—I think about her an inordinate amount. During my first appointment, a few weeks prior, she classified my lifestyle as “sedentary-active.” I was confused and, for some reason, offended. She clarified the paradox,“You spend all day hunched over a laptop, and then you run around like a chicken with your head cut off.” It was accurate, and so I considered my shoulders, which moved my head from the screen to the ground.\n\nAt the next appointment, she said “Oh you runners are infamous for your weak hips.” She proceeded to twist my hips in all sorts of directions, then she argued with her clipboard. “Plus four… no wait, maybe minus five. Minus five, yes. Minus five on hip abduction.”\n\nAs I lay amongst the other heavy breathing graduate students, I also thought of my foot. It was the reason I had met my PT soul-mate. One of my feet had an extra bone, and both had been broken.\n\nOr maybe, I thought, as someone new joined walked in and took off their shoes, it was my eyes. They are becoming increasingly worse with age, yet I still don’t treat them well. “Daily contacts are for just ONE day,” my mom reminds me.\n\nI finally decided on my hands, who do the most work with the least credit. I thought of the rubber band I’d been shooting at people all day, of the thousands of keys on the computer I’d hit, of the bike brakes I squeezed, the dishes I washed. I thought of my finger, which had been broken in the summer during a flag football game and has never healed, and of the place on my palm where skin peeled off from touching my pumpkin bread loaf pan too early. Maybe that’s why I hide them under my torso when I sleep—to protect them.\n\nMy alarm went off at the same time our body mapping guide indicated it was time to sit up. I could improve on my body mapping and awareness skills. I spent a majority of our deep breathing time analyzing the history and functionality of my body parts.\n\nWhile I slipped my boots on and gave my friend the signal: I have to go. The motion is a combination of a thumbs up and pointing towards the door. I had to bike over to the class I was taking at the law school, which would promptly undo the release of tension I had worked on here. “That’s just the cost of business” is said often during those two hours, and I don’t find it relaxing.\n\nMeanwhile, the other body mappers were looking contently up at the sky. They were the opposite of “business” or “costs,” probably still holding a metaphorical flower or being stretched into an eternity.\n\nI’d read an article about collective joy a few days before, and thought, then, about the ability of humans to spread sensation through a space without touching. A person's tone of voice or a body posture can change everyone around them. When many people adopt the same mannerisms and temperament, when they begin to really share a space, you can't help but be swept up. I imagine if they had given me five extra minutes or a pair of Nikes, I would’ve skipped law class.\n"}],"exp":"My Shared Somatosensory Experience: “Harvard’s Gate”","expDesc":"Participated in a body mapping workshop","mode":"Written Reflection","mode_h":"Written Reflection","title_h":"Touch &amp; Body Awareness","exp_h":"\u003cb>My Shared Somatosensory Experience:\u003c/b> “Harvard’s Gate”","expDesc_h":"\u003ci>Participated in a body mapping workshop\u003c/i>"},{"id":"taste","title":"Taste","kicker":"Gustatory","suggest":["video","text"],"blocks":[{"id":"w0gyh5rs","type":"text","items":[],"files":[],"images":[],"heading":"","body":"I parked my bike next to a pile of dirty green T-shirts. As I crossed the road to Five Spices, I wondered two things: what kind of intramural sports team abandoned their uniform in the middle of Central Square, and if I would return from this dinner as a changed and scarred woman—if I returned at all.\n\nWhen Alisa heard about my project, trying “mala” at this restaurant was the first thing she proposed. “Oh, that sounds great!” I said, hoping “mala” was some sort of cookie. \n\nI was unpleasantly surprised to find out mala is a numbing Chinese seasoning. I wasn’t set up for success. In New Hampshire, spicy foods are less common than moose sightings.  \n\nDays beforehand, standing in the crunchy leaves of Radcliffe Yard, Jenn described the sensation of the spice as “static in your mouth.” I don’t think I’ve ever wanted to taste static, I thought, thinking of myself licking the curved screen of the old TV that used to click with electricity when you put your finger near it. \n\nI was equally nervous about another word she tossed out— “fiery.” In college, my friend Leon added a spicy Colombian sauce to her dinner. I thought she looked cool doing it, so I added some too. “That’s gonna ruin your night,” she said, looking at the pile of red rice sideways. She was right.\n\nWhen I arrived at the table towards the back of the restaurant, Jenn was calm. She always is. She wears sleek clothing, takes ballet, and gently carries her tall frame around the campus. Alisa was more nervous; she had brought the menu closer to her face, inspecting it closely. Was it possible that she was more concerned about my mouth than I was? Maybe her nerves were due to a warning from Mom, who has heard about this trip and was worried for me as well. I pictured a woman in Tokyo, opening up an image from her daughter and shaking her head. Upon seeing my face and my complexion, she knew I was doomed from way across the world. \n\nTogether, Jenn and Alisa discussed what to get—some combination of ingredients I had never heard of. I needed both of them, Jenn to provide steady assurance and Alisa to protect me on the journey ahead. The things I am willing to do for a project concern me. I imagine, if I deemed it necessary for an assignment, I would eat an air-fried tarantula or, heaven forbid, watch a live musical.\n\nEventually, we went up to the counter. Jenn pointed her finger at small eggs and coils of mushrooms. Alisa nodded her head at the man who was confirming the list. I copied her. I had no idea what the hell I was about to ingest, but I was gearing up for battle. \n\nWhen it arrived, Alisa let out a sigh of relief. “It’s not as red as I thought.” \n\nAfter my first bite, I nodded at my friends and gave a thumbs-up. Alisa’s shoulder untensed. Jenn shouted words of encouragement, like I was a marathoner in the last few miles. \n\nOver dinner, I learned about all the foods my friends grew up with, and the restaurants I should try. There was too much to do in too little time. All I know is that next time, I will order my dry pot with “medium spice.” ","body_h":"I parked my bike next to a pile of dirty green T-shirts. As I crossed the road to Five Spices, I wondered two things: what kind of intramural sports team abandoned their uniform in the middle of Central Square, and if I would return from this dinner as a changed and scarred woman—if I returned at all.\u003cbr>\u003cbr>When Alisa heard about my project, trying “mala” at this restaurant was the first thing she proposed. “Oh, that sounds great!” I said, hoping “mala” was some sort of cookie. \u003cbr>\u003cbr>I was unpleasantly surprised to find out mala is a numbing Chinese seasoning. I wasn’t set up for success. In New Hampshire, spicy foods are less common than moose sightings.  \u003cbr>\u003cbr>
